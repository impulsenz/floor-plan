<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pest Station Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: top bar · slim tool rail · plan canvas · inspector panel (sheet on phones) */
:root{
  --bg:#e8ebee; --panel:#fbfcfc; --panel-2:#f0f2f4; --line:#d3d9de; --ink:#1a1f24; --ink-2:#56616b; --ink-3:#88929b;
  --accent:#d9480f; --accent-soft:#fde6d9; --accent-ink:#ffffff; --stage:#d5dbe0; --sel:#1c7ed6; --danger:#c92a2a; --ok:#2b8a3e;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 10px 32px rgba(20,28,36,.2);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121519; --panel:#1a1e23; --panel-2:#22272d; --line:#30373f; --ink:#e6eaee; --ink-2:#9ca6b0; --ink-3:#6c7680;
  --accent:#f76b2b; --accent-soft:#3b2418; --accent-ink:#1a1209; --stage:#0c0f12; --sel:#4dabf7; --danger:#ff6b6b; --ok:#51cf66;
  --shadow:0 10px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121519; --panel:#1a1e23; --panel-2:#22272d; --line:#30373f; --ink:#e6eaee; --ink-2:#9ca6b0; --ink-3:#6c7680;
  --accent:#f76b2b; --accent-soft:#3b2418; --accent-ink:#1a1209; --stage:#0c0f12; --sel:#4dabf7; --danger:#ff6b6b; --ok:#51cf66;
  --shadow:0 10px 32px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-ui);font-size:14px;line-height:1.4;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));padding-top:max(6px,env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.brand svg{flex:none}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 0;overflow:hidden;font-family:var(--f-head);font-size:15px;font-weight:600}
.crumbs a{color:var(--ink-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-3)}
.crumbs .cur{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.status{font-size:12px;color:var(--ink-3);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{height:26px;padding:0 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.zoom{font-family:var(--f-mono);font-size:12px;min-width:50px;height:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;font-variant-numeric:tabular-nums}
.only-narrow{display:none}

/* pages */
#view{min-height:0;position:relative}
.page{height:100%;overflow:auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.page-head h1{font-family:var(--f-head);font-size:30px;font-weight:700;margin:0;letter-spacing:-.2px;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.search{height:34px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 10px;min-width:0;width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s, transform .12s}
.card:hover{border-color:var(--ink-3)}
.thumb{aspect-ratio:16/10;background:var(--panel-2);display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mono-tile{font-family:var(--f-head);font-weight:700;font-size:40px;color:var(--ink-3);letter-spacing:1px}
.card .meta{padding:12px 14px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card h3{margin:0;font-family:var(--f-head);font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{margin:0;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:2px;padding:6px 8px 10px;margin-top:auto}
.card-actions .btn{height:26px;font-size:12.5px;padding:0 8px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-head);margin:0 0 6px;color:var(--ink);font-size:20px}
.site-info{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--ink-2);font-size:13.5px}
.site-info b{color:var(--ink);font-weight:600}

/* editor */
.editor{display:grid;grid-template-columns:52px minmax(0,1fr) 330px;height:100%;min-height:0}
.tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto}
.tools .sep{width:26px;height:1px;background:var(--line);margin:5px 0;flex:none}
.tool{width:38px;height:38px;flex:none;border:0;border-radius:8px;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;position:relative}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:20px;height:20px}
.stage-wrap{position:relative;background:var(--stage);overflow:hidden;min-width:0;touch-action:none}
#stage{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:default}
#stage.draw{cursor:crosshair}
#stage.pan,#stage.space{cursor:grab}
#stage.panning{cursor:grabbing}
.hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hud>div{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;font-size:12.5px;color:var(--ink-2);max-width:70%;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hud .coords{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
.dropzone{position:absolute;inset:0;border:3px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);display:grid;place-items:center;font-family:var(--f-head);font-size:22px;font-weight:700;color:var(--accent);pointer-events:none}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:40px;border:0;background:none;font-family:var(--f-head);font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{font-family:var(--f-head);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);margin:0}
.hint{color:var(--ink-2);font-size:13px;margin:0}
.f{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.f>span{color:var(--ink-2)}
.f input:not([type=color]):not([type=range]),.f select,.f textarea{width:100%;min-width:0;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 8px}
.f textarea{height:auto;min-height:64px;padding:6px 8px;resize:vertical;font-family:inherit}
.f input[type=color]{width:100%;height:30px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer}
.f input[type=range]{width:100%}
.f.stack{grid-template-columns:1fr}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;border:1px solid var(--line);border-radius:15px;padding:0 11px;background:var(--panel);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip svg{width:16px;height:16px}
.divider{height:1px;background:var(--line);margin:2px 0}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}

.cats{display:flex;flex-direction:column;gap:4px}
.cat{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left}
.cat:hover{border-color:var(--ink-3)}
.cat.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cat-main{display:flex;flex-direction:column;min-width:0}
.cat-code{font-family:var(--f-mono);font-weight:600;font-size:13px}
.cat-name{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cat kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.armed{border:1px solid var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel))}
.armed .big{font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--accent)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2)}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.idbig{font-family:var(--f-mono);font-size:22px;font-weight:600}
.warn{color:var(--danger);font-size:12.5px}

.reg-tools{display:flex;gap:6px;flex-wrap:wrap}
.reg-tools select,.reg-tools input{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 8px;min-width:0}
.reg-tools input{flex:1}
.reg{width:100%;border-collapse:collapse;font-size:12.5px}
.reg th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--panel)}
.reg td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.reg tr{cursor:pointer}
.reg tr:hover td{background:var(--panel-2)}
.reg tr.on td{background:var(--accent-soft)}
.reg .id{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.reg .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.reg .notes{color:var(--ink-3)}
.imglist{display:flex;flex-direction:column;gap:6px}
.imgrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px}
.imgrow img{width:44px;height:32px;object-fit:cover;border-radius:3px;background:var(--panel-2)}
.imgrow .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(10,14,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(980px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.modal h2{margin:0;font-family:var(--f-head);font-size:20px;font-weight:700}
.modal .x{width:30px;height:30px;border:0;background:none;font-size:22px;color:var(--ink-3);cursor:pointer;border-radius:6px}
.modal .x:hover{background:var(--panel-2)}
.modal-body{padding:8px 16px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-body p{margin:0;color:var(--ink-2)}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.modal .f{grid-template-columns:120px minmax(0,1fr)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:7px 0;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--sel);outline-offset:-2px}
.sat{display:flex;flex-direction:column;gap:10px}
.sat-search{display:flex;gap:6px}
.sat-search input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 10px}
.sat-res{display:flex;flex-wrap:wrap;gap:6px}
.sat-res button{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:3px 10px;font-size:12.5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sat-map{height:min(58vh,560px);border-radius:8px;border:1px solid var(--line);background:#222;overflow:hidden}
.sat-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legend-ed{width:100%;border-collapse:collapse;font-size:13px}
.legend-ed th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);padding:4px}
.legend-ed td{padding:3px 4px}
.legend-ed input,.legend-ed select{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 6px;min-width:0}
.legend-ed input[type=color]{padding:2px;width:42px}
.legend-ed .code{width:62px;font-family:var(--f-mono);text-transform:uppercase}
.tbl-wrap{overflow-x:auto}
.filelist{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px}

#toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:7px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(520px,90vw)}
.toast.warn{background:var(--danger);color:#fff}

@media (max-width:820px){
  .editor{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:4px max(8px,env(safe-area-inset-left,0px));padding-bottom:max(4px,env(safe-area-inset-bottom,0px));grid-row:2}
  .tools .sep{width:1px;height:26px;margin:0 4px}
  .stage-wrap{grid-row:1}
  .panel{position:fixed;right:0;top:50px;bottom:0;width:min(360px,100%);z-index:20;transform:translateX(102%);transition:transform .18s;box-shadow:var(--shadow)}
  .panel.open{transform:none}
  .only-narrow{display:inline-grid}
  .hide-narrow{display:none!important}
  .crumbs a,.crumbs .sep{display:none}
  .crumbs .cur{font-size:14px}
  .top{gap:6px}
  .top-actions{gap:2px}
  .brand .word{display:none}
  .hud{bottom:8px}
  .hud .hint-box{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="brand" id="brand" title="All sites">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3" fill="var(--accent)"/><rect x="6" y="9" width="5" height="6" rx="1" fill="var(--panel)"/><circle cx="16" cy="12" r="2.2" fill="var(--panel)"/></svg>
      <span class="word">Station Planner</span>
    </button>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="top-actions" id="topActions"></div>
  </header>
  <main id="view"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileIn" multiple hidden accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.pdf,.json,image/*,application/pdf">
<datalist id="stypes"></datalist>

<script>
'use strict';
/* ================================================================
   Pest Station Planner — local-first floor plan editor.
   Storage lives behind the `Store` object so a cloud database
   (e.g. Supabase + Google login) can replace it later.
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clone=o=>structuredClone(o);
const fmtDate=t=>new Date(t).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'});

const TOX='#d62828', NONTOX='#2b9348', MAPFONT='Arial, Helvetica, sans-serif';
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const CDN={

/* ---------------- storage (IndexedDB, swap-ready) ---------------- */
const Store={
  db:null, mem:{sites:new Map(),maps:new Map(),assets:new Map(),meta:new Map()},
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{const q=indexedDB.open('pest-station-planner',1);
        q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('sites',{keyPath:'id'});const m=d.createObjectStore('maps',{keyPath:'id'});m.createIndex('siteId','siteId');d.createObjectStore('assets',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'id'});};
        q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);});
    }catch(e){ this.db=null; setTimeout(()=>toast('This browser is blocking storage, so plans will be lost when the tab closes.','warn'),300); }
  },
  run(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  async all(s){return this.db?this.run(s,'readonly',o=>o.getAll()):[...this.mem[s].values()].map(clone);},
  async get(s,id){return this.db?this.run(s,'readonly',o=>o.get(id)):clone(this.mem[s].get(id));},
  async put(s,v){if(!this.db){this.mem[s].set(v.id,clone(v));return;}return this.run(s,'readwrite',o=>o.put(v));},
  async del(s,id){if(!this.db){this.mem[s].delete(id);return;}return this.run(s,'readwrite',o=>o.delete(id));},
  async mapsOf(siteId){return this.db?this.run('maps','readonly',o=>o.index('siteId').getAll(siteId)):[...this.mem.maps.values()].filter(m=>m.siteId===siteId).map(clone);}
};

function modal({title,body,buttons=[{label:'Cancel',value:null},{label:'OK',value:'ok',primary:true}],wide=false,onOpen,before}){
  return new Promise(res=>{
    const wrap=document.createElement('div');wrap.className='modal-wrap';
    wrap.innerHTML=`<form class="modal ${wide?'wide':''}" novalidate><header><h2>${esc(title)}</h2><button type="button" class="x" data-x="1" aria-label="Close">×</button></header><div class="modal-body">${body}</div><footer>${buttons.map((b,i)=>`<button type="${b.primary?'submit':'button'}" class="btn ${b.primary?'primary':''} ${b.danger?'danger':''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</footer></form>`;
    document.body.appendChild(wrap);const form=$('form',wrap);
    const read=()=>{const o={};for(const el of form.elements){if(!el.name)continue;if(el.type==='checkbox')o[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)o[el.name]=el.value;}else if(el.type==='file')o[el.name]=el.files;else o[el.name]=el.value;}return o;};
    let busy=false;
    const finish=async v=>{if(busy)return;const data=read();if(before&&v!==null){busy=true;let ok;try{ok=await before(v,data,wrap);}catch(e){toast(e.message||String(e),'warn');ok=false;}busy=false;if(ok===false)return;}
      wrap.remove();document.removeEventListener('keydown',onKey,true);res({value:v,data});};
    const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();finish(null);}};
    document.addEventListener('keydown',onKey,true);
    form.addEventListener('submit',e=>{e.preventDefault();const p=buttons.find(b=>b.primary);finish(p?p.value:'ok');});
    form.addEventListener('click',e=>{const b=e.target.closest('footer button,header .x');if(!b||b.type==='submit')return;e.preventDefault();if(b.dataset.x)return finish(null);finish(buttons[+b.dataset.i].value);});
    wrap.addEventListener('pointerdown',e=>{if(e.target===wrap)finish(null);});
    onOpen&&onOpen(wrap,form);
    const f=$('.modal-body input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]), .modal-body textarea',wrap);f&&setTimeout(()=>{f.focus();f.select&&f.select();},40);
  });
}

const getEl=id=>M.elements.find(e=>e.id===id);
const walls=()=>M.elements.filter(e=>e.type==='wall');
const wallLen=w=>Math.hypot(w.x2-w.x1,w.y2-w.y1);

function fmtLen(px){return M.scale?`${(px/M.scale).toFixed(2)} m`:`${Math.round(px)} px`;}
function projWall(w,p){const dx=w.x2-w.x1,dy=w.y2-w.y1,L2=dx*dx+dy*dy||1;const t=clamp(((p.x-w.x1)*dx+(p.y-w.y1)*dy)/L2,0,1);const q={x:w.x1+dx*t,y:w.y1+dy*t};return{t,d:dist(p,q),q};}

    case 'rect':case 'ellipse':case 'image':return{x:el.x,y:el.y,w:el.w,h:el.h};
    case 'polygon':{const xs=el.pts.map(p=>p[0]),ys=el.pts.map(p=>p[1]);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
    case 'text':{const n=$(`#L-main [data-id="${el.id}"]`);if(n){try{const b=n.getBBox();return{x:b.x,y:b.y,w:b.width,h:b.height};}catch(e){}}return{x:el.x,y:el.y,w:60,h:el.size};}

  let s='';for(const[a,b]of segs){const A=a-(a<=.01?el.w/2:0),B=b+(b>=L-.01?el.w/2:0);
    s+=`<line x1="${r2(el.x1+ux*A)}" y1="${r2(el.y1+uy*A)}" x2="${r2(el.x1+ux*B)}" y2="${r2(el.y1+uy*B)}" stroke="${el.color}" stroke-width="${el.w}" stroke-linecap="butt"/>`;}

function shapeMarkup(el){

function lineMarkup(el,ex){

function titleMarkup(){

  const cell=(x,y,label,val,size=12.5,bold=false)=>`<text x="${x}" y="${y}" font-family="${MAPFONT}" font-size="9" letter-spacing="1" fill="#868e96">${label}</text><text x="${x}" y="${y+15}" font-family="${MAPFONT}" font-size="${size}" font-weight="${bold?700:400}" fill="#1a1f24">${esc(val)}</text>`;

function northMarkup(){const N=M.furn.north;if(!N.show)return'';
  return `<g data-furn="north" transform="translate(${N.x} ${N.y}) scale(${N.s||1}) rotate(${N.rot||0})"><circle r="24" fill="#ffffff" fill-opacity=".92" stroke="#1a1f24" stroke-width="1.2"/><polygon points="0,-18 7,8 0,3 -7,8" fill="#1a1f24"/><text y="20" text-anchor="middle" font-family="${MAPFONT}" font-size="11" font-weight="700" fill="#1a1f24">N</text></g>`;}

function mainMarkup(ex){
  const els=M.elements,wmap=new Map(),ops=new Map();
  for(const e of els)if(e.type==='wall')wmap.set(e.id,e);
  for(const e of els)if(e.type==='door'&&wmap.has(e.wall)){if(!ops.has(e.wall))ops.set(e.wall,[]);ops.get(e.wall).push(e);}
  let s='';
  for(const e of els)if(e.type==='rect'||e.type==='ellipse'||e.type==='polygon')s+=shapeMarkup(e);
  for(const e of els)if(e.type==='wall')s+=wallMarkup(e,ops.get(e.id)||[],ex);
  for(const e of els)if(e.type==='door'&&wmap.has(e.wall))s+=doorMarkup(e,wmap.get(e.wall),ex);
  for(const e of els)if(e.type==='line'||e.type==='arrow'||e.type==='dim')s+=lineMarkup(e,ex);
  for(const e of els)if(e.type==='text')s+=textMarkup(e);

function buildSVG({bg=true}={}){
  const W=M.width,H=M.height;let imgs='';

async function rasterize(scale=1,bg=true){
  const svg=buildSVG({bg}),W=M.width,H=M.height;let sc=scale;const maxSide=16000,maxArea=120e6;
  sc=Math.min(sc,maxSide/W,maxSide/H,Math.sqrt(maxArea/(W*H)));
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{const img=await loadImg(url);const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c;}
  finally{URL.revokeObjectURL(url);}
}

/* ----- snapping ----- */
function snapP(p,e,anchor){
  const k=E.view.k;let best=null,bd=10/k;
  for(const el of M.elements)if('x1' in el&&el.type!=='dim'){for(const q of [{x:el.x1,y:el.y1},{x:el.x2,y:el.y2}]){const d=dist(p,q);if(d<bd){bd=d;best=q;}}}
  if(E.chain)for(const q of E.chain.pts){const d=dist(p,q);if(d<bd){bd=d;best=q;}}
  if(best&&!e.altKey){E.snapHit={...best};return{...best};}
  E.snapHit=null;let q={...p};
  if(anchor&&e.shiftKey){const ang=Math.atan2(p.y-anchor.y,p.x-anchor.x),sa=Math.round(ang/(Math.PI/4))*(Math.PI/4),len=dist(p,anchor);q={x:anchor.x+Math.cos(sa)*len,y:anchor.y+Math.sin(sa)*len};
    if(M.settings.snap&&!e.altKey){const g=M.settings.grid;if(Math.abs(Math.cos(sa))>.99)q.x=Math.round(q.x/g)*g;else if(Math.abs(Math.sin(sa))>.99)q.y=Math.round(q.y/g)*g;}}
  else if(M.settings.snap&&!e.altKey){const g=M.settings.grid;q={x:Math.round(p.x/g)*g,y:Math.round(p.y/g)*g};}
  return q;
}

function defaultDoorWidth(kind){const d=DOORS.find(x=>x[0]===kind);return r2((d?d[2]:.9)*S());}
function add(el){el.id=el.id||uid();M.elements.push(el);return el;}
function addRoom(x,y,w,h){const ws=E.wallStyle,mk=(a,b,c,d)=>add({type:'wall',x1:a,y1:b,x2:c,y2:d,w:ws.w,color:ws.color});return[mk(x,y,x+w,y),mk(x+w,y,x+w,y+h),mk(x+w,y+h,x,y+h),mk(x,y+h,x,y)];}
function finishDraw(d){

    case 'room':if(Math.abs(w)<4||Math.abs(h)<4)return;pushHist();addRoom(x,y,Math.abs(w),Math.abs(h));break;
    case 'rect':case 'ellipse':pushHist();el=add({type:E.tool,x,y,w:Math.abs(w),h:Math.abs(h),stroke:st.stroke,fill:st.fill,noFill:st.noFill,fillOp:st.fillOp,sw:st.sw,dash:st.dash,rx:E.tool==='rect'?st.rx:0});break;
    case 'line':case 'arrow':pushHist();el=add({type:E.tool,x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:st.stroke,sw:st.sw,dash:st.dash});break;

function chainClick(e,p){
  const k=E.view.k,last=E.chain?.pts[E.chain.pts.length-1],q=snapP(p,e,last);

  if(dist(q,last)*k<5){finishChain(false);return;}
  if(E.chain.pts.length>=2&&dist(q,E.chain.pts[0])*k<9){E.chain.pts.push({...E.chain.pts[0]});finishChain(true);return;}
  E.chain.pts.push(q);renderOverlay();
}
function finishChain(closed){
  const ch=E.chain;E.chain=null;E.chainCur=null;if(!ch)return;const pts=ch.pts;
  if(E.tool==='wall'&&pts.length>=2){pushHist();const ws=E.wallStyle;for(let i=0;i<pts.length-1;i++)if(dist(pts[i],pts[i+1])>1)add({type:'wall',x1:pts[i].x,y1:pts[i].y,x2:pts[i+1].x,y2:pts[i+1].y,w:ws.w,color:ws.color});changed();}
  else if(E.tool==='polygon'){const u=closed?pts.slice(0,-1):pts;if(u.length>=3){pushHist();const st=E.style;const el=add({type:'polygon',pts:u.map(p=>[p.x,p.y]),stroke:st.stroke,fill:st.fill,noFill:st.noFill,fillOp:st.fillOp,sw:st.sw,dash:st.dash});E.sel=new Set([el.id]);changed();}else renderOverlay();}
  else renderOverlay();

function placeDoor(p){

  pushHist();const width=Math.min(defaultDoorWidth(E.doorKind),wallLen(nw.wall)*.95);
  const el=add({type:'door',kind:E.doorKind,wall:nw.wall.id,t:clampT(nw.t,nw.wall,width),width,flip:0,hinge:0});E.sel=new Set([el.id]);changed();
}
function placeStation(p){
  const cat=catOf(E.cat),ct=E.catType[E.cat]||{},stype=ct.type??cat.type;
  const toxic=ct.toxic??(knownTox(stype)??(cat.mode==='tox'));

function createText(p){pushHist();const el=add({type:'text',x:r2(p.x),y:r2(p.y),text:'Label',...E.textStyle});E.sel=new Set([el.id]);setTool('select');showTab('props');changed();renderPanel();
  const ta=$('#tabBody textarea[data-k="text"]');if(ta){ta.focus();ta.select();}}
async function calibrate(px){
  const r=await modal({title:'Set the plan scale',body:`<p>The line you drew is ${Math.round(px)} px long. How long is it in real life?</p><label class="f"><span>Length (metres)</span><input name="m" type="number" min="0.01" step="0.01" inputmode="decimal"></label>`,buttons:[{label:'Cancel',value:null},{label:'Set scale',value:'ok',primary:true}],
    before:(v,d)=>{if(!(parseFloat(d.m)>0)){toast('Enter a length greater than zero.','warn');return false;}}});
  setTool('select');if(r.value!=='ok')return;pushHist();M.scale=r2(px/parseFloat(r.data.m)*1000)/1000;toast(`Scale set: 1 m = ${M.scale.toFixed(1)} px`);changed();showTab('map');
}
function deleteSel(){if(!E.sel.size)return;pushHist();const ids=E.sel;M.elements=M.elements.filter(e=>!ids.has(e.id)&&!(e.type==='door'&&ids.has(e.wall)));E.sel=new Set();changed();}
function duplicateSel(){
  if(!E.sel.size)return;pushHist();const map=new Map(),out=[],off=M.settings.grid||20;
  const src=M.elements.filter(e=>E.sel.has(e.id));
  for(const e of src){if(e.type==='door')continue;const n=clone(e);n.id=uid();map.set(e.id,n.id);moveEl(n,off,off);if(n.type==='station')n.num=nextNum(n.code)+out.filter(o=>o.type==='station'&&o.code===n.code).length;out.push(n);}
  for(const e of src)if(e.type==='door'){const n=clone(e);n.id=uid();if(map.has(e.wall))n.wall=map.get(e.wall);else{const w=getEl(e.wall);n.t=clampT(e.t+e.width/(wallLen(w)||1)*1.2,w,e.width);}out.push(n);}

/* ----- pointer handling ----- */
function bindEditor(){
  const st=$('#stage'),ptrs=new Map();let pinch=null;
  st.addEventListener('contextmenu',e=>e.preventDefault());
  st.addEventListener('mousedown',e=>e.preventDefault());
  st.addEventListener('pointerdown',e=>{
    if(document.activeElement&&document.activeElement!==document.body&&$('#panel').contains(document.activeElement))document.activeElement.blur();
    try{st.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){E.drag=null;const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,v:{...E.view}};return;}
    if(ptrs.size>2)return;onDown(e);
  });
  st.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],r=st.getBoundingClientRect(),d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
      const k=clamp(pinch.v.k*d/pinch.d,.03,24),wx=(pinch.cx-r.left-pinch.v.x)/pinch.v.k,wy=(pinch.cy-r.top-pinch.v.y)/pinch.v.k;E.view={k,x:cx-r.left-wx*k,y:cy-r.top-wy*k};applyView();return;}
    onMove(e);
  });
  const up=e=>{ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return;}onUp(e);};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('pointerleave',()=>{if(!E.drag){E.cursor=null;renderOverlay();}});
  st.addEventListener('wheel',e=>{e.preventDefault();
    if(!e.ctrlKey&&(Math.abs(e.deltaX)>Math.abs(e.deltaY)*.5)&&e.deltaMode===0&&!Number.isInteger(e.deltaY)){E.view.x-=e.deltaX;E.view.y-=e.deltaY;applyView();return;}
    zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)*(e.deltaMode===1?30:1)));},{passive:false});
  $('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;const t=b.dataset.tool;
    if(t==='import-m')return $('#fileIn').click();if(t==='sat-m')return openSatellite();setTool(t);});
  $('#panel .tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab);});
  const tb=$('#tabBody');tb.addEventListener('input',onPanelInput);tb.addEventListener('change',onPanelChange);tb.addEventListener('click',onPanelClick);
  const wrap=$('#stageWrap');let dz=null;
  wrap.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();if(!dz){dz=document.createElement('div');dz.className='dropzone';dz.textContent='Drop to import';wrap.appendChild(dz);}}});
  wrap.addEventListener('dragleave',e=>{if(!wrap.contains(e.relatedTarget)){dz?.remove();dz=null;}});
  wrap.addEventListener('drop',e=>{e.preventDefault();dz?.remove();dz=null;if(e.dataTransfer.files.length)importIntoEditor([...e.dataTransfer.files]);});
  new ResizeObserver(()=>{if(route==='map')renderOverlay();}).observe(wrap);
}
$('#fileIn').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length&&route==='map')importIntoEditor(f);});

function onDown(e){
  const p=toWorld(e),t=E.tool;E.cursor=p;
  if(e.button===1||e.button===2||E.space||t==='pan'){E.drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:E.view.x,vy:E.view.y};$('#stage').classList.add('panning');return;}
  if(e.button!==0)return;
  if(t==='select')return downSelect(e,p);
  if(t==='wall'||t==='polygon')return chainClick(e,p);
  if(['room','rect','ellipse','line','arrow','dim','calib'].includes(t)){const q=snapP(p,e);E.drag={kind:'draw',a:q,b:q};renderOverlay();return;}
  if(t==='text')return createText(p);
  if(t==='door')return placeDoor(p);
  if(t==='station')return placeStation(p);
}
function downSelect(e,p){
  const tg=e.target,h=tg.closest('[data-handle]');
  if(h&&E.sel.size===1){const el=getEl([...E.sel][0]);const d={kind:'handle',h:h.dataset.handle,id:el.id,orig:clone(el),start:p,pushed:false};
    if(el.type==='wall'&&(d.h==='p1'||d.h==='p2')){const P=d.h==='p1'?{x:el.x1,y:el.y1}:{x:el.x2,y:el.y2};d.conn=[];for(const w of walls()){if(w.id===el.id)continue;if(dist({x:w.x1,y:w.y1},P)<.6)d.conn.push([w.id,'1']);if(dist({x:w.x2,y:w.y2},P)<.6)d.conn.push([w.id,'2']);}}
    E.drag=d;return;}
  const f=tg.closest('[data-furn]');if(f){const part=f.dataset.furn,F=M.furn[part];E.sel.clear();E.drag={kind:'furn',part,start:p,ox:F.x,oy:F.y,pushed:false};renderAll();return;}
  const g=tg.closest('[data-id]');
  if(g&&g.closest('#vp')){const id=g.getAttribute('data-id');
    if(e.shiftKey){E.sel.has(id)?E.sel.delete(id):E.sel.add(id);}else if(!E.sel.has(id))E.sel=new Set([id]);
    E.drag={kind:'move',start:p,orig:new Map([...E.sel].map(i=>[i,clone(getEl(i))]).filter(x=>x[1])),pushed:false};showTab('props');renderOverlay();return;}
  if(!e.shiftKey&&E.sel.size){E.sel.clear();renderPanel();}
  E.drag={kind:'marquee',a:p,b:p,add:e.shiftKey};renderOverlay();
}
function onMove(e){
  const p=toWorld(e);E.cursor=p;const d=E.drag;
  $('#coords').textContent=M.scale?`${(p.x/M.scale).toFixed(1)}, ${(p.y/M.scale).toFixed(1)} m · ${Math.round(E.view.k*100)}%`:`${Math.round(p.x)}, ${Math.round(p.y)} px · ${Math.round(E.view.k*100)}%`;
  if(!d){if(E.chain){const l=E.chain.pts[E.chain.pts.length-1];E.chainCur=snapP(p,e,l);}else if(E.tool==='wall')snapP(p,e);renderOverlay();return;}
  const k=E.view.k;
  switch(d.kind){
    case 'pan':E.view.x=d.vx+e.clientX-d.sx;E.view.y=d.vy+e.clientY-d.sy;applyView();break;
    case 'move':{let dx=p.x-d.start.x,dy=p.y-d.start.y;if(!d.pushed){if(Math.hypot(dx,dy)*k<3)return;pushHist();d.pushed=true;}
      const onlyFree=[...d.orig.values()].every(o=>o.type==='station'||o.type==='text'||o.type==='door');
      if(M.settings.snap&&!e.altKey&&!onlyFree){const g=M.settings.grid;dx=Math.round(dx/g)*g;dy=Math.round(dy/g)*g;}
      for(const[id,o]of d.orig){const el=getEl(id);if(!el)continue;
        if(el.type==='door'){if(d.orig.size===1){const nw=nearestWall(p);if(nw){el.wall=nw.wall.id;el.t=clampT(nw.t,nw.wall,el.width);}}continue;}
        Object.assign(el,clone(o));moveEl(el,dx,dy);}
      render();break;}
    case 'handle':{const el=getEl(d.id);if(!d.pushed){pushHist();d.pushed=true;}const o=d.orig;
      if(d.h==='p1'||d.h==='p2'){const anchor=d.h==='p1'?{x:o.x2,y:o.y2}:{x:o.x1,y:o.y1};const q=snapP(p,e,anchor);el['x'+d.h[1]]=q.x;el['y'+d.h[1]]=q.y;
        for(const[wid,end]of d.conn||[]){const w=getEl(wid);if(w){w['x'+end]=q.x;w['y'+end]=q.y;}}}
      else if(d.h==='se'){const q=snapP(p,e);let w=Math.max(4,q.x-el.x),h=Math.max(4,q.y-el.y);if(el.type==='image'&&!e.shiftKey){const ar=o.w/o.h;h=w/ar;}el.w=w;el.h=h;}
      else if(d.h[0]==='v'){const q=snapP(p,e);el.pts[+d.h.slice(1)]=[q.x,q.y];}
      render();break;}
    case 'furn':{if(!d.pushed){pushHist();d.pushed=true;}const F=M.furn[d.part];F.x=Math.round(d.ox+p.x-d.start.x);F.y=Math.round(d.oy+p.y-d.start.y);render();break;}
    case 'marquee':d.b=p;renderOverlay();break;
    case 'draw':d.b=snapP(p,e,['line','arrow','dim','calib'].includes(E.tool)?d.a:null);renderOverlay();break;
  }
}
function onUp(){
  const d=E.drag;E.drag=null;$('#stage').classList.remove('panning');if(!d)return;
  if(d.kind==='marquee'){const x=Math.min(d.a.x,d.b.x),y=Math.min(d.a.y,d.b.y),w=Math.abs(d.b.x-d.a.x),h=Math.abs(d.b.y-d.a.y);
    if(w*E.view.k>3||h*E.view.k>3){for(const el of M.elements){if(el.type==='image'&&el.locked)continue;const b=bboxOf(el);if(b.x<x+w&&b.x+b.w>x&&b.y<y+h&&b.y+b.h>y)E.sel.add(el.id);}if(E.sel.size)showTab('props');}

const typing=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
document.addEventListener('keydown',e=>{
  if(route!=='map'||$('.modal-wrap'))return;
  if(typing(e.target)){if(e.key==='Escape')e.target.blur();return;}
  const mod=e.ctrlKey||e.metaKey,key=e.key.toLowerCase();
  if(mod&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&key==='y'){e.preventDefault();redo();return;}
  if(mod&&key==='d'){e.preventDefault();duplicateSel();return;}
  if(mod&&key==='a'){e.preventDefault();selectAll();return;}
  if(mod&&key==='s'){e.preventDefault();saveNow();toast('Saved');return;}
  if(mod||e.altKey)return;
  switch(e.key){
    case 'Delete':case 'Backspace':e.preventDefault();deleteSel();return;
    case 'Escape':if(E.chain)finishChain(false);else if(E.tool!=='select')setTool('select');else{E.sel.clear();renderAll();}return;
    case 'Enter':if(E.chain)finishChain(false);return;
    case ' ':e.preventDefault();E.space=true;$('#stage').classList.add('space');return;
    case '+':case '=':zoomBy(1.25);return;case '-':case '_':zoomBy(.8);return;case '0':fitView();return;
    case 'ArrowLeft':case 'ArrowRight':case 'ArrowUp':case 'ArrowDown':{if(!E.sel.size)return;e.preventDefault();softPush();const s=e.shiftKey?10:1;const dx=e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,dy=e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0;
      for(const id of E.sel){const el=getEl(id);if(el&&el.type!=='door')moveEl(el,dx,dy);}changed();return;}
  }
  if(/^[1-9]$/.test(e.key)){const c=CATS[+e.key-1];if(c){setTool('station',c.code);showTab('stations');}return;}
  const map={v:'select',h:'pan',w:'wall',r:'room',d:'door',b:'rect',e:'ellipse',p:'polygon',l:'line',a:'arrow',m:'dim',t:'text'};
  if(map[key])setTool(map[key]);
});
document.addEventListener('keyup',e=>{if(e.key===' '){E.space=false;$('#stage')?.classList.remove('space');}});

function onPanelInput(e){
  const t=e.target;if(t.id==='regQ'){E.regQ=t.value;const pos=t.selectionStart;renderPanel();const n=$('#regQ');n.focus();n.setSelectionRange(pos,pos);return;}
  const sc=t.dataset.s,k=t.dataset.k;if(!sc||!k)return;
  let v=t.type==='checkbox'?t.checked:(t.type==='number'||t.type==='range')?parseFloat(t.value):t.value;
  if(typeof v==='number'&&isNaN(v))return;
  setVal(sc,k,v);
}
function onPanelChange(e){const t=e.target;if(t.id==='regF'){E.regFilter=t.value;renderPanel();return;}
  if(t.type==='checkbox'||t.tagName==='SELECT')renderPanel();
  else if(t.dataset.k==='stype')renderPanel();}
function setVal(sc,k,v){
  if(sc==='arm'){const c=E.cat;E.catType[c]=E.catType[c]||{};E.catType[c][k]=v;if(k==='type'){const kt=knownTox(v);if(kt!==null)E.catType[c].toxic=kt;}renderOverlay();return;}
  if(sc==='style'){E.style[k]=v;return;}
  if(sc==='text'){E.textStyle[k]=v;return;}
  if(sc==='wall'){E.wallStyle[k]=v;return;}
  softPush();
  if(sc==='map'){if(k==='name'){M.name=v;crumbs([['Sites','#/'],[site?.name||'Site','#/site/'+M.siteId],[v,'#/map/'+M.id]]);}else if(v>=50)M[k]=Math.round(v);changed();return;}
  if(sc==='set'){M.settings[k]=v;changed();return;}
  if(sc==='furn'){const[p,kk]=k.split('.');if(p==='all'){for(const x in M.furn)M.furn[x].s=v;}else M.furn[p][kk]=v;changed();return;}
  for(const id of E.sel){const el=getEl(id);if(!el)continue;
    switch(k){
      case 'len':{const L=Math.hypot(el.x2-el.x1,el.y2-el.y1)||1,n=fromU(v);if(n<=0)break;el.x2=el.x1+(el.x2-el.x1)/L*n;el.y2=el.y1+(el.y2-el.y1)/L*n;break;}
      case 'wU':el.w=Math.max(1,fromU(v));break;case 'hU':el.h=Math.max(1,fromU(v));break;
      case 'width':if(el.type==='door'){el.width=Math.max(2,fromU(v));const w=getEl(el.wall);if(w)el.t=clampT(el.t,w,el.width);}else if(el.type==='image'){const ar=el.w/el.h;el.w=Math.max(4,v);el.h=el.w/ar;}break;
      case 'w':if(el.type==='image'){const ar=el.w/el.h;el.w=Math.max(4,v);el.h=el.w/ar;}else el.w=v;break;
      case 'stype':el.stype=v;{const kt=knownTox(v);if(kt!==null)el.toxic=kt;}break;
      case 'num':el.num=Math.max(1,Math.round(v));break;
      case 'code':el.code=v;el.num=nextNum(v);{const c=catOf(v);if(c.mode!=='tox'&&!el.stype)el.stype=c.type;}break;
      default:el[k]=v;
    }}
  render();scheduleSave();
}
async function onPanelClick(e){
  const sw=e.target.closest('[data-sw]');if(sw){const inp=sw.closest('.f').querySelector('input[type=color]');inp.value=sw.dataset.sw;setVal(sw.dataset.s,sw.dataset.k,sw.dataset.sw);return;}
  const cat=e.target.closest('[data-cat]');if(cat){const c=cat.dataset.cat;if(E.tool==='station'&&E.cat===c)setTool('select');else{E.sel.clear();setTool('station',c);}renderPanel();return;}
  const dk=e.target.closest('[data-door]');if(dk){E.doorKind=dk.dataset.door;renderPanel();return;}
  const de=e.target.closest('[data-door-el]');if(de){pushHist();for(const id of E.sel){const el=getEl(id);if(el?.type==='door'){el.kind=de.dataset.doorEl;el.width=defaultDoorWidth(el.kind);const w=getEl(el.wall);if(w){el.width=Math.min(el.width,wallLen(w)*.95);el.t=clampT(el.t,w,el.width);}}}changed();return;}
  const loc=e.target.closest('[data-loc]');if(loc){const el=getEl(loc.dataset.loc);E.sel=new Set([el.id]);if(E.view.k<.6)E.view.k=1;centerOn(el.x,el.y);renderPanel();return;}
  const il=e.target.closest('[data-img-lock]');if(il){pushHist();const el=getEl(il.dataset.imgLock);el.locked=!el.locked;changed();return;}
  const id2=e.target.closest('[data-img-del]');if(id2){pushHist();M.elements=M.elements.filter(x=>x.id!==id2.dataset.imgDel);changed();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  switch(b.dataset.act){
    case 'stop':setTool('select');break;
    case 'edit-legend':editLegend();break;
    case 'dup':duplicateSel();break;case 'del':deleteSel();break;
    case 'flip':case 'hinge':pushHist();for(const id of E.sel){const el=getEl(id);if(el?.type==='door')el[b.dataset.act]=el[b.dataset.act]?0:1;}changed();break;
    case 'fit-board':{const el=getEl([...E.sel][0]);pushHist();const dx=-el.x,dy=-el.y;M.width=Math.round(el.w);M.height=Math.round(el.h);if(dx||dy)for(const x of M.elements)moveEl(x,dx,dy);layoutFurn();changed();fitView();break;}
    case 'csv':exportCSV();break;
    case 'renum':{const c=E.regFilter;if(!await confirmBox('Close numbering gaps',`Renumber all ${esc(c)} stations as ${esc(c)}001, ${esc(c)}002 and so on, keeping their current order?`,'Renumber'))return;
      pushHist();M.elements.filter(x=>x.type==='station'&&x.code===c).sort((a,b)=>a.num-b.num).forEach((x,i)=>x.num=i+1);changed();toast(`${c} stations renumbered`);break;}
    case 'calib':setTool('calib');break;
    case 'noscale':pushHist();M.scale=null;changed();break;
    case 'relayout':pushHist();layoutFurn();changed();break;
  }
}

async function editLegend(){
  const row=(c,i)=>`<tr data-i="${i}"><td><input class="code" name="code" value="${esc(c.code)}" maxlength="4" aria-label="Prefix"></td><td><input name="name" value="${esc(c.name)}" aria-label="Name"></td>

    <td><select name="mode" aria-label="Colour rule"><option value="tox" ${c.mode==='tox'?'selected':''}>Red toxic / green non-toxic</option><option value="fixed" ${c.mode!=='tox'?'selected':''}>Fixed colour</option></select></td>
    <td><input type="color" name="color" value="${c.color}" aria-label="Colour"></td><td><input name="type" value="${esc(c.type)}" list="stypes" aria-label="Default type"></td><td><button type="button" class="btn sm ghost danger" data-rm aria-label="Remove">✕</button></td></tr>`;
  const r=await modal({title:'Station types',wide:true,body:`<p>Prefixes set the ID on the plan, so T gives T001. Stations already placed keep their prefix if you rename it here.</p>
    <div class="tbl-wrap"><table class="legend-ed"><thead><tr><th>Prefix</th><th>Name</th><th>Shape</th><th>Colour rule</th><th>Colour</th><th>Default type</th><th></th></tr></thead><tbody id="lgRows">${CATS.map(row).join('')}</tbody></table></div>
    <div class="row"><button type="button" class="btn sm" id="lgAdd">${ICON.plus}Add a type</button><button type="button" class="btn sm ghost" id="lgReset">Reset to defaults</button></div>`,
    buttons:[{label:'Cancel',value:null},{label:'Save',value:'ok',primary:true}],
    onOpen:w=>{const tb=$('#lgRows',w);$('#lgAdd',w).onclick=()=>{tb.insertAdjacentHTML('beforeend',row({code:'',name:'',shape:'circle',mode:'fixed',color:'#495057',type:''},tb.children.length));};
      $('#lgReset',w).onclick=()=>{tb.innerHTML=DEFAULT_CATS.map(row).join('');};w.addEventListener('click',e=>{const x=e.target.closest('[data-rm]');if(x)x.closest('tr').remove();});},
    before:(v,d,w)=>{const rows=$$('#lgRows tr',w).map(tr=>{const g=n=>$(`[name=${n}]`,tr).value.trim();return{code:g('code').toUpperCase(),name:g('name'),shape:g('shape'),mode:g('mode'),color:$('[name=color]',tr).value,type:g('type')};}).filter(c=>c.code||c.name);
      if(rows.some(c=>!/^[A-Z0-9]{1,4}$/.test(c.code))){toast('Each prefix needs 1–4 letters or numbers.','warn');return false;}
      if(new Set(rows.map(c=>c.code)).size!==rows.length){toast('Two types share the same prefix.','warn');return false;}
      legendRows=rows;}});
  if(r.value!=='ok'||!legendRows)return;
  CATS=legendRows;legendRows=null;await Store.put('meta',{id:'cats',value:CATS});
  if(E.tool==='station'&&!CATS.find(c=>c.code===E.cat))setTool('select');
  changed();toast('Station types saved');
}

async function fileToImg(file,page=1){
  const n=file.name.toLowerCase();
  if(n.endsWith('.pdf')||file.type==='application/pdf'){
    await loadScript(CDN.pdfjs);window.pdfjsLib.GlobalWorkerOptions.workerSrc=CDN.pdfworker;
    const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await doc.getPage(clamp(page,1,doc.numPages));
    const v1=pg.getViewport({scale:1}),sc=Math.min(4,2600/Math.max(v1.width,v1.height)),vp=pg.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;return{src:c.toDataURL('image/png'),w:c.width,h:c.height,pages:doc.numPages};
  }
  let src=await readAs(file,'readAsDataURL');const img=await loadImg(src);let w=img.naturalWidth||1200,h=img.naturalHeight||900;
  const isSvg=n.endsWith('.svg')||file.type.includes('svg');const max=4096;
  if(!isSvg&&Math.max(w,h)>max){const s=max/Math.max(w,h);const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    src=file.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.9);w=c.width;h=c.height;}
  return{src,w,h};
}
function setBackground(img,{scale=null,meta=null}={}){
  pushHist();const aid=uid();E.assets[aid]=img.src;E.assetsDirty=true;

  M.width=Math.round(img.w);M.height=Math.round(img.h);M.scale=scale;M.bgMeta=meta;

}

async function importIntoEditor(files,forceMode){
  const json=files.filter(f=>/\.json$/i.test(f.name)),imgs=files.filter(f=>!/\.json$/i.test(f.name));
  if(json.length){await importMapFiles(json);toast('Plan files were added to this site. Open them from the site page.');}
  if(!imgs.length)return;
  const bad=imgs.filter(f=>!/\.(png|jpe?g|gif|webp|bmp|svg|pdf)$/i.test(f.name)&&!f.type.startsWith('image/')&&f.type!=='application/pdf');
  if(bad.length){toast(`Can't import ${bad.map(f=>f.name).join(', ')}. Use PNG, JPG, GIF, WEBP, BMP, SVG, PDF or a plan .json file.`,'warn');}
  const ok=imgs.filter(f=>!bad.includes(f));if(!ok.length)return;
  let mode=forceMode,page=1;
  if(!mode){const hasBg=M.elements.some(e=>e.type==='image'&&e.bg),hasPdf=ok.some(f=>/\.pdf$/i.test(f.name));
    const r=await modal({title:`Import ${ok.length} file${ok.length>1?'s':''}`,body:`<ul class="filelist">${ok.map(f=>`<li>${esc(f.name)}</li>`).join('')}</ul>
      <div class="seg"><label><input type="radio" name="mode" value="bg" ${!M.elements.length||!hasBg?'checked':''}><span>Use as background</span></label><label><input type="radio" name="mode" value="place" ${M.elements.length&&hasBg?'checked':''}><span>Place as image</span></label></div>
      <p class="hint">Background resizes the page to fit and locks the image so you can draw over it${hasBg?'. It replaces the current background':''}. ${ok.length>1?'Only the first file becomes the background; the rest are placed as images.':''}</p>
      ${hasPdf?`<label class="f"><span>PDF page</span><input type="number" name="page" value="1" min="1" step="1"></label>`:''}`,
      buttons:[{label:'Cancel',value:null},{label:'Import',value:'ok',primary:true}]});
    if(r.value!=='ok')return;mode=r.data.mode;page=parseInt(r.data.page||'1',10)||1;}
  toast('Importing…');
  for(let i=0;i<ok.length;i++){try{const im=await fileToImg(ok[i],page);if(i===0&&mode==='bg'){setBackground(im);if(!M.scale)toast('Background set. Use Plan › Calibrate to set the scale from a known length.');}else placeImage(im,i);}
    catch(e){console.error(e);toast(`${ok[i].name} could not be imported: ${e.message}`,'warn');}}
}

/* ================= SATELLITE ================= */
async function openSatellite(){
  let lm=null;
  const r=await modal({title:'Satellite background',wide:true,
    body:`<div class="sat"><div class="sat-search"><input id="satQ" type="search" placeholder="Search an address or place" value="${esc(site?.address||'')}" aria-label="Address"><button type="button" class="btn" id="satGo">Search</button></div><div class="sat-res" id="satRes"></div><div class="sat-map" id="satMap"></div>
      <div class="sat-foot"><label class="chk"><input type="checkbox" name="hi" checked> High resolution (2×)</label><span>Frame the property, then use this view. The plan scale is set for you.</span></div></div>`,
    buttons:[{label:'Cancel',value:null},{label:'Use this view',value:'use',primary:true}],
    onOpen:async w=>{
      try{loadCss(CDN.leafletCss);await loadScript(CDN.leaflet);}catch(e){$('#satMap',w).innerHTML='<p style="color:#fff;padding:16px">The map library could not load. Check the internet connection.</p>';return;}
      const g=site?.geo;lm=L.map($('#satMap',w),{maxZoom:19,zoomSnap:1}).setView(g?[g.lat,g.lng]:[-40.9,174.9],g?g.zoom:5);
      L.tileLayer(ESRI,{maxZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(lm);setTimeout(()=>lm.invalidateSize(),60);
      const search=async()=>{const q=$('#satQ',w).value.trim();if(!q)return;const res=$('#satRes',w);res.textContent='Searching…';
        try{const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q),{headers:{'Accept-Language':'en'}})).json();
          if(!j.length){res.textContent='No places found. Try fewer words, or pan the map yourself.';return;}
          res.innerHTML=j.map((p,i)=>`<button type="button" data-ll="${p.lat},${p.lon}" title="${esc(p.display_name)}">${esc(p.display_name.split(',').slice(0,3).join(','))}</button>`).join('');
          lm.setView([+j[0].lat,+j[0].lon],18);}catch(e){res.textContent='Search is unavailable right now. Pan and zoom the map instead.';}};
      $('#satGo',w).onclick=search;$('#satQ',w).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}});
      $('#satRes',w).addEventListener('click',e=>{const b=e.target.closest('[data-ll]');if(b){const[a,o]=b.dataset.ll.split(',').map(Number);lm.setView([a,o],18);}});
      if(!g&&site?.address)search();
    },
    before:async(v,d,w)=>{if(!lm){toast('The map has not loaded yet.','warn');return false;}
      const btn=$('footer .primary',w);btn.disabled=true;btn.textContent='Capturing…';
      try{w.__img=await captureTiles(lm,d.hi);}catch(e){btn.disabled=false;btn.textContent='Use this view';toast('Could not capture the imagery: '+e.message,'warn');return false;}
      r_hold.img=w.__img;r_hold.geo={lat:lm.getCenter().lat,lng:lm.getCenter().lng,zoom:lm.getZoom()};}
  });
  if(r.value!=='use'||!r_hold.img)return;const{img,geo}=r_hold;r_hold.img=null;
  setBackground(img,{scale:img.pxPerM,meta:{attr:true,lat:geo.lat,lng:geo.lng,zoom:img.zoom}});
  if(site){site.geo=geo;Store.put('sites',site);}
  toast(`Satellite background set. Scale: 1 m = ${img.pxPerM.toFixed(2)} px.`);showTab('stations');
}
const r_hold={img:null,geo:null};
async function captureTiles(lm,hi){
  const z=lm.getZoom(),zz=Math.min(19,z+(hi?1:0)),f=2**(zz-z),size=lm.getSize(),b=lm.getPixelBounds();
  const ox=b.min.x*f,oy=b.min.y*f,W=Math.round(size.x*f),H=Math.round(size.y*f),n=2**zz;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#333';x.fillRect(0,0,W,H);
  const jobs=[];let fails=0;
  for(let tx=Math.floor(ox/256);tx<=Math.floor((ox+W-1)/256);tx++)for(let ty=Math.floor(oy/256);ty<=Math.floor((oy+H-1)/256);ty++){
    if(ty<0||ty>=n)continue;const wx=((tx%n)+n)%n;
    jobs.push(new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{x.drawImage(im,tx*256-ox,ty*256-oy);res();};im.onerror=()=>{fails++;res();};im.src=ESRI.replace('{z}',zz).replace('{y}',ty).replace('{x}',wx);}));}
  await Promise.all(jobs);if(fails===jobs.length)throw new Error('the imagery server did not respond');
  const lat=lm.getCenter().lat,mpp=156543.03392*Math.cos(lat*Math.PI/180)/2**zz;
  return{src:c.toDataURL('image/jpeg',.9),w:W,h:H,pxPerM:1/mpp,zoom:zz};
}

    <label class="f" id="exPaper" hidden><span>PDF page</span><select name="paper"><option value="a4">A4</option><option value="a3" selected>A3</option><option value="fit">Same shape as the plan</option></select></label>

async function doExport(d){
  const name=safeName(d.fname||'plan'),bg=d.bg,res=parseFloat(d.res||'2');await saveNow();
  if(d.fmt==='svg'){download(new Blob([buildSVG({bg})],{type:'image/svg+xml'}),name+'.svg');return;}
  const c=await rasterize(d.fmt==='pdf'?Math.max(2,res):res,bg);
  if(d.fmt==='png'||d.fmt==='jpg'){const blob=await new Promise(r=>c.toBlob(r,d.fmt==='png'?'image/png':'image/jpeg',.92));if(!blob)throw new Error('the browser could not create the image');download(blob,name+'.'+d.fmt);return;}
  const jpg=new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',.92))).arrayBuffer());
  const PAPER={a4:[595.28,841.89],a3:[841.89,1190.55]};const land=M.width>=M.height;let pw,ph,iw,ih,ix,iy;
  if(d.paper==='fit'){pw=M.width*.75;ph=M.height*.75;iw=pw;ih=ph;ix=0;iy=0;}
  else{const P=PAPER[d.paper]||PAPER.a3;[pw,ph]=land?[P[1],P[0]]:P;const m=22,s=Math.min((pw-2*m)/M.width,(ph-2*m)/M.height);iw=M.width*s;ih=M.height*s;ix=(pw-iw)/2;iy=(ph-ih)/2;}
  download(makePdf(jpg,c.width,c.height,pw,ph,ix,iy,iw,ih,`${site?.name||''} - ${M.name}`),name+'.pdf');
}
/* Minimal single-page PDF writer: one JPEG drawn at (x,y,w,h) in points. */
function makePdf(jpg,pxW,pxH,pw,ph,x,y,w,h,title){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(n,body,stream)=>{offs[n]=len;push(`${n} 0 obj\n${body}\n`);if(stream){push('stream\n');push(stream);push('\nendstream\n');}push('endobj\n');};
  const f=v=>(Math.round(v*100)/100).toString();
  const pdfStr=t=>'('+String(t).replace(/[^\x20-\x7e]/g,'-').replace(/([\\()])/g,'\\$1')+')';
  const content=enc.encode(`q ${f(w)} 0 0 ${f(h)} ${f(x)} ${f(ph-y-h)} cm /Im0 Do Q`);
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw)} ${f(ph)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4,`<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`,jpg);
  obj(5,`<< /Length ${content.length} >>`,content);
  obj(6,`<< /Title ${pdfStr(title)} /Creator (Station Planner) >>`);
  const xref=len;let x2=`xref\n0 7\n0000000000 65535 f \n`;for(let i=1;i<=6;i++)x2+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x2+`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
function exportCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const rows=[['Station ID','Category','Type','Toxic','Notes',M.scale?'X (m)':'X (px)',M.scale?'Y (m)':'Y (px)'].map(q).join(',')];
  M.elements.filter(e=>e.type==='station').sort((a,b)=>a.code.localeCompare(b.code)||a.num-b.num).forEach(e=>{const c=catOf(e.code);rows.push([stId(e),c.name,e.stype,c.mode==='tox'?(e.toxic?'Yes':'No'):'',e.notes,M.scale?(e.x/M.scale).toFixed(2):Math.round(e.x),M.scale?(e.y/M.scale).toFixed(2):Math.round(e.y)].map(q).join(','));});
  download(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'}),safeName(`${site?.name||'Site'} - ${M.name} - station register`)+'.csv');
}
