<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pest Station Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: top bar · slim tool rail · plan canvas · inspector panel (sheet on phones) */
:root{
  --bg:#e8ebee; --panel:#fbfcfc; --panel-2:#f0f2f4; --line:#d3d9de; --ink:#1a1f24; --ink-2:#56616b; --ink-3:#88929b;
  --accent:#d9480f; --accent-soft:#fde6d9; --accent-ink:#ffffff; --stage:#d5dbe0; --sel:#1c7ed6; --danger:#c92a2a; --ok:#2b8a3e;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 10px 32px rgba(20,28,36,.2);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121519; --panel:#1a1e23; --panel-2:#22272d; --line:#30373f; --ink:#e6eaee; --ink-2:#9ca6b0; --ink-3:#6c7680;
  --accent:#f76b2b; --accent-soft:#3b2418; --accent-ink:#1a1209; --stage:#0c0f12; --sel:#4dabf7; --danger:#ff6b6b; --ok:#51cf66;
  --shadow:0 10px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121519; --panel:#1a1e23; --panel-2:#22272d; --line:#30373f; --ink:#e6eaee; --ink-2:#9ca6b0; --ink-3:#6c7680;
  --accent:#f76b2b; --accent-soft:#3b2418; --accent-ink:#1a1209; --stage:#0c0f12; --sel:#4dabf7; --danger:#ff6b6b; --ok:#51cf66;
  --shadow:0 10px 32px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-ui);font-size:14px;line-height:1.4;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));padding-top:max(6px,env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.brand svg{flex:none}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 0;overflow:hidden;font-family:var(--f-head);font-size:15px;font-weight:600}
.crumbs a{color:var(--ink-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-3)}
.crumbs .cur{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.status{font-size:12px;color:var(--ink-3);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{height:26px;padding:0 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.zoom{font-family:var(--f-mono);font-size:12px;min-width:50px;height:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;font-variant-numeric:tabular-nums}
.only-narrow{display:none}

/* pages */
#view{min-height:0;position:relative}
.page{height:100%;overflow:auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.page-head h1{font-family:var(--f-head);font-size:30px;font-weight:700;margin:0;letter-spacing:-.2px;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.search{height:34px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 10px;min-width:0;width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s, transform .12s}
.card:hover{border-color:var(--ink-3)}
.thumb{aspect-ratio:16/10;background:var(--panel-2);display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mono-tile{font-family:var(--f-head);font-weight:700;font-size:40px;color:var(--ink-3);letter-spacing:1px}
.card .meta{padding:12px 14px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card h3{margin:0;font-family:var(--f-head);font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{margin:0;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:2px;padding:6px 8px 10px;margin-top:auto}
.card-actions .btn{height:26px;font-size:12.5px;padding:0 8px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-head);margin:0 0 6px;color:var(--ink);font-size:20px}
.site-info{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--ink-2);font-size:13.5px}
.site-info b{color:var(--ink);font-weight:600}

/* editor */
.editor{display:grid;grid-template-columns:112px minmax(0,1fr) 330px;height:100%;min-height:0}
.tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;overflow-y:auto;user-select:none;-webkit-user-select:none}
.tools .sep{display:none}
.tool{width:92px;flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--ink-2);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;outline:none}
.tool:hover{color:var(--ink);background:var(--panel-2)}
.tool:focus-visible{border-color:var(--sel);box-shadow:0 0 0 2px color-mix(in srgb,var(--sel) 30%,transparent)}
.tool.on,.tool.on:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.tool svg{width:27px;height:27px;stroke-width:1.7}
.tool .tl{font-size:13.5px;font-weight:600;line-height:1;letter-spacing:.1px;white-space:nowrap}
.tool.on .tl{font-weight:700}
.tool .tl,.tool svg{pointer-events:none}
.stage-wrap{position:relative;background:var(--stage);overflow:hidden;min-width:0;touch-action:none}
#stage{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:default}
#stage.draw{cursor:crosshair}
#stage.pan,#stage.space{cursor:grab}
#stage.panning{cursor:grabbing}
.hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hud>div{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;font-size:12.5px;color:var(--ink-2);max-width:70%;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hud .coords{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
.dropzone{position:absolute;inset:0;border:3px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);display:grid;place-items:center;font-family:var(--f-head);font-size:22px;font-weight:700;color:var(--accent);pointer-events:none}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:40px;border:0;background:none;font-family:var(--f-head);font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{font-family:var(--f-head);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);margin:0}
.hint{color:var(--ink-2);font-size:13px;margin:0}
.f{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.f>span{color:var(--ink-2)}
.f input:not([type=color]):not([type=range]),.f select,.f textarea{width:100%;min-width:0;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 8px}
.f textarea{height:auto;min-height:64px;padding:6px 8px;resize:vertical;font-family:inherit}
.f input[type=color]{width:100%;height:30px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer}
.f input[type=range]{width:100%}
.f.stack{grid-template-columns:1fr}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;border:1px solid var(--line);border-radius:15px;padding:0 11px;background:var(--panel);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip svg{width:16px;height:16px}
.divider{height:1px;background:var(--line);margin:2px 0}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}

.cats{display:flex;flex-direction:column;gap:4px}
.cat{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left}
.cat:hover{border-color:var(--ink-3)}
.cat.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cat-main{display:flex;flex-direction:column;min-width:0}
.cat-code{font-family:var(--f-mono);font-weight:600;font-size:13px}
.cat-name{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cat kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.armed{border:1px solid var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel))}
.armed .big{font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--accent)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2)}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.idbig{font-family:var(--f-mono);font-size:22px;font-weight:600}
.warn{color:var(--danger);font-size:12.5px}

.reg-tools{display:flex;gap:6px;flex-wrap:wrap}
.reg-tools select,.reg-tools input{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 8px;min-width:0}
.reg-tools input{flex:1}
.reg{width:100%;border-collapse:collapse;font-size:12.5px}
.reg th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--panel)}
.reg td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.reg tr{cursor:pointer}
.reg tr:hover td{background:var(--panel-2)}
.reg tr.on td{background:var(--accent-soft)}
.reg .id{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.reg .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.reg .notes{color:var(--ink-3)}
.imglist{display:flex;flex-direction:column;gap:6px}
.imgrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px}
.imgrow img{width:44px;height:32px;object-fit:cover;border-radius:3px;background:var(--panel-2)}
.imgrow .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(10,14,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(980px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.modal h2{margin:0;font-family:var(--f-head);font-size:20px;font-weight:700}
.modal .x{width:30px;height:30px;border:0;background:none;font-size:22px;color:var(--ink-3);cursor:pointer;border-radius:6px}
.modal .x:hover{background:var(--panel-2)}
.modal-body{padding:8px 16px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-body p{margin:0;color:var(--ink-2)}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.modal .f{grid-template-columns:120px minmax(0,1fr)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:7px 0;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--sel);outline-offset:-2px}
.sat{display:flex;flex-direction:column;gap:10px}
.sat-search{display:flex;gap:6px}
.sat-search input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 10px}
.sat-res{display:flex;flex-wrap:wrap;gap:6px}
.sat-res button{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:3px 10px;font-size:12.5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sat-map{height:min(58vh,560px);border-radius:8px;border:1px solid var(--line);background:#222;overflow:hidden}
.sat-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legend-ed{width:100%;border-collapse:collapse;font-size:13px}
.legend-ed th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);padding:4px}
.legend-ed td{padding:3px 4px}
.legend-ed input,.legend-ed select{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 6px;min-width:0}
.legend-ed input[type=color]{padding:2px;width:42px}
.legend-ed .code{width:62px;font-family:var(--f-mono);text-transform:uppercase}
.tbl-wrap{overflow-x:auto}
.filelist{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px}
.drawbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:5;max-width:calc(100% - 20px);flex-wrap:nowrap;justify-content:center;white-space:nowrap}
.drawbar .seg{flex:none}
.drawbar .seg span{padding:5px 10px}
.dbinfo{font-size:12.5px;color:var(--ink-2);padding:0 4px;white-space:nowrap}
.popmenu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column;gap:2px;min-width:210px}
.popmenu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink);width:100%}
.popmenu button:hover{background:var(--panel-2)}
.popmenu button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.popmenu svg{width:18px;height:18px;flex:none}
.popmenu kbd,.popmenu small{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.popmenu small{font-family:inherit;font-size:12px}
.tool .more{position:absolute;right:9px;top:11px;pointer-events:none;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.7}
.sat-search{position:relative}
.sat-search input{width:100%}
.sat-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:1200;list-style:none;margin:0;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:300px;overflow-y:auto}
.sat-list li{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sat-list li b{font-weight:600;font-size:13.5px}
.sat-list li span{font-size:12px;color:var(--ink-2)}
.sat-list li.on,.sat-list li:hover{background:var(--panel-2)}
.sat-list li.none{cursor:default;color:var(--ink-2)}
.sat-frame{position:relative;height:min(54vh,520px);max-width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#222}
.sat-frame .sat-map{position:absolute;height:auto;border:0;border-radius:0;transform-origin:50% 50%}
.sat-rot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.sat-rot input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.sat-rot output{font-family:var(--f-mono);font-size:12.5px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.sat-rot .lbl{color:var(--ink-2);font-weight:600}
.room-sw{display:flex;flex-wrap:wrap;gap:6px}
.room-sw label{position:relative;cursor:pointer}
.room-sw input{position:absolute;opacity:0;pointer-events:none}
.room-sw span{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.room-sw input:checked+span{outline:2px solid var(--accent);outline-offset:2px}
.room-sw input:focus-visible+span{outline:2px solid var(--sel);outline-offset:2px}
.objlib{display:flex;flex-direction:column;gap:12px}
.objlib input[type=search]{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 10px;width:100%}
.objgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.objtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;min-width:0}
.objtile:hover{border-color:var(--ink-3)}
.objtile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.objtile .pv{width:100%;aspect-ratio:4/3;background:#ffffff;border-radius:5px;display:grid;place-items:center;overflow:hidden}
.objtile .pv svg{width:86%;height:86%}
.objtile span{font-size:11.5px;line-height:1.2;text-align:center;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.objtile.on span{color:var(--accent);font-weight:600}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent);border-radius:6px}100%{box-shadow:0 0 0 0 transparent}}
#L-main .fld{fill:transparent;cursor:pointer}
#L-main .fld:hover{fill:rgba(28,126,214,.10)}
.logo-prev{max-height:34px;max-width:110px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:2px}
.f [aria-invalid=true]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 8px;font-size:13px}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:7px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(520px,90vw)}
.toast.warn{background:var(--danger);color:#fff}

@media (max-width:820px){
  .editor{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:4px max(8px,env(safe-area-inset-left,0px));padding-bottom:max(4px,env(safe-area-inset-bottom,0px));grid-row:2}
  .tools .sep{display:none}
  .tools{gap:2px;padding-top:6px}
  .tool{width:58px;padding:6px 2px 5px;gap:5px}
  .tool svg{width:22px;height:22px}
  .tool .tl{font-size:11.5px}
  .stage-wrap{grid-row:1}
  .panel{position:fixed;right:0;top:50px;bottom:0;width:min(360px,100%);z-index:20;transform:translateX(102%);transition:transform .18s;box-shadow:var(--shadow)}
  .panel.open{transform:none}
  .only-narrow{display:inline-grid}
  .hide-narrow{display:none!important}
  .crumbs a,.crumbs .sep{display:none}
  .crumbs .cur{font-size:14px}
  .top{gap:6px}
  .top-actions{gap:2px}
  .brand .word{display:none}
  .hud{bottom:8px}
  .hud .hint-box{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* Server storage. Every read and write goes to the Station Planner server (see server/ in the repo).
   The server address comes from ?api=… (remembered), or is this page's own address when the app is served by the server. */
function resolveApi(){
  let q=null;try{q=new URLSearchParams(location.search).get('api');}catch(e){}
  if(q){q=q.trim().replace(/\/+$/,'');try{localStorage.setItem('psp-api',q);}catch(e){}
    try{const u=new URL(location.href);u.searchParams.delete('api');history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}return q;}
  try{const v=localStorage.getItem('psp-api');if(v)return v;}catch(e){}
  if(/^https?:$/.test(location.protocol)&&!/\.github\.io$/.test(location.hostname))return location.origin;
  return '';
}
const Store={
  base:resolveApi(),online:false,
  setBase(v){this.base=String(v||'').trim().replace(/\/+$/,'');try{localStorage.setItem('psp-api',this.base);}catch(e){}},
  async req(method,path,body){
    if(!this.base)throw new Error('No server address set');
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),body?120000:30000);
    let r;try{r=await fetch(this.base+'/api'+path,{method,signal:ctl.signal,cache:'no-store',headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined});}
    catch(e){this.online=false;throw new Error(e.name==='AbortError'?'The server took too long to answer':'Cannot reach the server');}
    finally{clearTimeout(t);}
    this.online=true;
    if(r.status===404&&method==='GET')return undefined;
    if(!r.ok){let m='';try{m=(await r.json()).error;}catch(e){}throw new Error(m||('Server error '+r.status));}
    return r.json();
  },
  async health(base=this.base){const r=await fetch(base.replace(/\/+$/,'')+'/api/health',{cache:'no-store'});if(!r.ok)throw new Error('Server error '+r.status);const j=await r.json();if(j.app!=='station-planner')throw new Error('That address is not a Station Planner server');return j;},
  async open(){if(!this.base)return false;try{await this.health();this.online=true;return true;}catch(e){this.online=false;return false;}},
  all(s){return this.req('GET','/'+s);},
  get(s,id){return this.req('GET',`/${s}/${encodeURIComponent(id)}`);},
  put(s,v){return this.req('PUT',`/${s}/${encodeURIComponent(v.id)}`,v);},
  del(s,id){return this.req('DELETE',`/${s}/${encodeURIComponent(id)}`);},
  mapsOf(siteId){return this.req('GET','/maps?siteId='+encodeURIComponent(siteId));}
};

function modal({title,body,buttons=[{label:'Cancel',value:null},{label:'OK',value:'ok',primary:true}],wide=false,onOpen,before}){
  return new Promise(res=>{
    const wrap=document.createElement('div');wrap.className='modal-wrap';
    wrap.innerHTML=`<form class="modal ${wide?'wide':''}" novalidate><header><h2>${esc(title)}</h2><button type="button" class="x" data-x="1" aria-label="Close">×</button></header><div class="modal-body">${body}</div><footer>${buttons.map((b,i)=>`<button type="${b.primary?'submit':'button'}" class="btn ${b.primary?'primary':''} ${b.danger?'danger':''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</footer></form>`;
    document.body.appendChild(wrap);const form=$('form',wrap);
    const read=()=>{const o={};for(const el of form.elements){if(!el.name)continue;if(el.type==='checkbox')o[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)o[el.name]=el.value;}else if(el.type==='file')o[el.name]=el.files;else o[el.name]=el.value;}return o;};
    let busy=false;
    const finish=async v=>{if(busy)return;const data=read();if(before&&v!==null){busy=true;let ok;try{ok=await before(v,data,wrap);}catch(e){toast(e.message||String(e),'warn');ok=false;}busy=false;if(ok===false)return;}
      wrap.remove();document.removeEventListener('keydown',onKey,true);res({value:v,data});};
    const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();finish(null);}};
    document.addEventListener('keydown',onKey,true);
    form.addEventListener('submit',e=>{e.preventDefault();const p=buttons.find(b=>b.primary);finish(p?p.value:'ok');});
    form.addEventListener('click',e=>{const b=e.target.closest('footer button,header .x');if(!b||b.type==='submit')return;e.preventDefault();if(b.dataset.x)return finish(null);finish(buttons[+b.dataset.i].value);});
    wrap.addEventListener('pointerdown',e=>{if(e.target===wrap)finish(null);});
    onOpen&&onOpen(wrap,form);
    const f=$('.modal-body input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]), .modal-body textarea',wrap);f&&setTimeout(()=>{f.focus();f.select&&f.select();},40);
  });
}

    case 'diamond':return `<polygon points="${poly(4,r*1.3)}" ATTR/>`;
    case 'hexagon':return `<polygon points="${poly(6,r*1.12,0)}" ATTR/>`;
    case 'pentagon':return `<polygon points="${poly(5,r*1.16)}" ATTR/>`;
    case 'panel':return `<rect x="${r2(-r*1.25)}" y="${r2(-r*.85)}" width="${r2(r*2.5)}" height="${r2(r*1.7)}" rx="${r2(r*.3)}" ATTR/>`;

/* ---------------- geometry ---------------- */
const getEl=id=>M.elements.find(e=>e.id===id);
const walls=()=>M.elements.filter(e=>e.type==='wall');
const wallLen=w=>Math.hypot(w.x2-w.x1,w.y2-w.y1);
const S=()=>M.scale||45; // px per metre (45 used when the plan has no scale yet)

    case 'polygon':{const xs=el.pts.map(p=>p[0]),ys=el.pts.map(p=>p[1]);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
    case 'text':{const n=$(`#L-main [data-id="${el.id}"]`);if(n){try{const b=n.getBBox();return{x:b.x,y:b.y,w:b.width,h:b.height};}catch(e){}}return{x:el.x,y:el.y,w:60,h:el.size};}
    case 'station':{const r=M.settings.marker*(el.size||1)*1.35;return{x:el.x-r,y:el.y-r,w:2*r,h:2*r};}
    case 'obj':{const cs=objCorners(el),xs=cs.map(p=>p.x),ys=cs.map(p=>p.y),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}

function moveEl(el,dx,dy){if('x1' in el){el.x1+=dx;el.y1+=dy;el.x2+=dx;el.y2+=dy;}else if(el.pts){el.pts=el.pts.map(p=>[p[0]+dx,p[1]+dy]);}else if('x' in el){el.x+=dx;el.y+=dy;}}

const zoneWalls=z=>z.walls.map(getEl).filter(w=>w&&w.type==='wall');

/* Station IDs sit to the right of the marker, and move to the left when that side is crowded
   by other stations, labels, objects, text or walls (or runs off the page). */
let LABEL_SIDES=new Map();
function rectsHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

  for(let i=0;i<4;i++){if(P[i]===0){if(Q[i]<0)return false;}else{const t=Q[i]/P[i];if(P[i]<0){if(t>t1)return false;if(t>t0)t0=t;}else{if(t<t0)return false;if(t<t1)t1=t;}}}return true;}
function layoutLabels(){
  const sts=M.elements.filter(e=>e.type==='station'),obst=[],segs=[],placed=[],out=new Map(),base=M.settings.marker,lf=M.settings.label;
  for(const e of sts){const r=base*(e.size||1)*1.3;obst.push({x:e.x-r,y:e.y-r,w:2*r,h:2*r,id:e.id});}
  for(const e of M.elements){if(e.type==='obj'||e.type==='text'){const b=bboxOf(e);obst.push({...b,id:e.id});}
    if(e.type==='wall'||e.type==='line'||e.type==='arrow')segs.push([e.x1,e.y1,e.x2,e.y2]);}
  for(const e of sts){const r=base*(e.size||1),f=lf*(e.size||1),w=stId(e).length*f*.62+2,h=f*1.15,gap=r*1.25+3;
    const R={x:e.x+gap,y:e.y-h/2,w,h},L={x:e.x-gap-w,y:e.y-h/2,w,h};
    if(e.labelSide==='left'||e.labelSide==='right'){out.set(e.id,e.labelSide);placed.push(e.labelSide==='left'?L:R);continue;}

function stationMarkup(el,ghost){

function mainMarkup(ex){

/* Read a plan back from our own .json or .svg export. Returns {map,assets} or null. */
async function readPlanFile(f){
  const txt=await readAs(f,'readAsText');
  if(/\.svg$/i.test(f.name)||/^\s*<(\?xml|svg)/.test(txt)){
    const doc=new DOMParser().parseFromString(txt,'image/svg+xml'),md=doc.querySelector('metadata#pest-station-planner');if(!md)return null;
    let j;try{j=JSON.parse(decodeURIComponent(escape(atob(md.textContent.trim()))));}catch(e){return null;}
    const assets={};doc.querySelectorAll('image[data-asset]').forEach(im=>{assets[im.getAttribute('data-asset')]=im.getAttribute('href')||im.getAttribute('xlink:href');});
    return{map:j.map,assets};}
  try{const j=JSON.parse(txt);return j.format==='pest-station-planner-map'?{map:j.map,assets:j.assets||{}}:null;}catch(e){return null;}
}
async function importMapFiles(files){
  for(const f of files){
    if(/\.(svg|json)$/i.test(f.name)){const pl=await readPlanFile(f).catch(()=>null);if(pl){const m={...pl.map,id:uid(),siteId:site.id,updated:Date.now(),thumb:null};await Store.put('maps',m);await Store.put('assets',{id:m.id,data:pl.assets});toast(`Imported ${m.name}`);continue;}}
    if(/\.json$/i.test(f.name)){toast(`${f.name} is not a Station Planner plan file.`,'warn');continue;}
    // any other drawing (an SVG from elsewhere, an image or a PDF) becomes a new plan with it as the background
    const m=newMap(site.id,f.name.replace(/\.[^.]+$/,''));await Store.put('maps',m);await Store.put('assets',{id:m.id,data:{}});
    E.pendingFiles=[f];location.hash='#/map/'+m.id;return;
  }
}

function renderOverlay(){
  if(route!=='map')return;const k=E.view.k,sel=getComputedStyle(document.documentElement).getPropertyValue('--sel').trim()||'#1c7ed6';
  const lbl=(x,y,t)=>`<text x="${x}" y="${y}" font-family="${MAPFONT}" font-size="${r2(12/k)}" font-weight="700" fill="${sel}" stroke="#fff" stroke-width="${r2(3.5/k)}" paint-order="stroke" stroke-linejoin="round">${esc(t)}</text>`;
  const sw=r2(1.5/k),dash=`stroke-dasharray="${r2(5/k)} ${r2(4/k)}"`;let s='';
  for(const id of E.sel){const el=getEl(id);if(!el)continue;const b=bboxOf(el),p=4/k;
    if(el.type==='obj'){const cs=objCorners(el);s+=`<polygon points="${cs.map(q=>r2(q.x)+','+r2(q.y)).join(' ')}" fill="none" stroke="${sel}" stroke-width="${sw}" ${dash}/>`;}
    else if(el.type==='station')s+=`<circle cx="${el.x}" cy="${el.y}" r="${r2(M.settings.marker*(el.size||1)*1.35+5/k)}" fill="none" stroke="${sel}" stroke-width="${sw}" ${dash}/>`;
    else s+=`<rect x="${r2(b.x-p)}" y="${r2(b.y-p)}" width="${r2(b.w+2*p)}" height="${r2(b.h+2*p)}" fill="none" stroke="${sel}" stroke-width="${sw}" ${dash}/>`;}
  if(E.tool==='select'&&(!E.drag||E.drag.kind==='node')){const seen=new Map();for(const w of walls())for(const q of [[w.x1,w.y1],[w.x2,w.y2]]){const key=Math.round(q[0]*2)+','+Math.round(q[1]*2);seen.set(key,{x:q[0],y:q[1],n:(seen.get(key)?.n||0)+1});}
    for(const nd of seen.values())s+=`<circle data-node="${nd.x},${nd.y}" cx="${r2(nd.x)}" cy="${r2(nd.y)}" r="${r2((nd.n>1?5:4)/k)}" fill="${nd.n>1?sel:'#ffffff'}" fill-opacity="${nd.n>1?.85:1}" stroke="${sel}" stroke-width="${r2(1.4/k)}" style="cursor:move"><title>Drag to move this corner</title></circle>`;}
  if(E.sel.size===1&&E.tool==='select'){const el=getEl([...E.sel][0]);if(el){const hs=9/k,h=(n,x,y)=>`<rect data-handle="${n}" x="${r2(x-hs/2)}" y="${r2(y-hs/2)}" width="${r2(hs)}" height="${r2(hs)}" fill="#fff" stroke="${sel}" stroke-width="${sw}" style="cursor:crosshair"/>`;
    if('x1' in el){s+=h('p1',el.x1,el.y1)+h('p2',el.x2,el.y2);if(el.type==='wall'||el.type==='line')s+=lbl(r2((el.x1+el.x2)/2+8/k),r2((el.y1+el.y2)/2-8/k),fmtLen(Math.hypot(el.x2-el.x1,el.y2-el.y1)));}

function downSelect(e,p){

    if(el.type==='wall'&&(d.h==='p1'||d.h==='p2')){const P=d.h==='p1'?{x:el.x1,y:el.y1}:{x:el.x2,y:el.y2};d.conn=[];for(const w of walls()){if(w.id===el.id)continue;if(dist({x:w.x1,y:w.y1},P)<.6)d.conn.push([w.id,'1']);if(dist({x:w.x2,y:w.y2},P)<.6)d.conn.push([w.id,'2']);}}

    for(const w of walls()){if(dist({x:w.x1,y:w.y1},P)<.6)conn.push([w.id,'1']);if(dist({x:w.x2,y:w.y2},P)<.6)conn.push([w.id,'2']);}

    const ids=new Set(E.sel);for(const i of E.sel){const z=getEl(i);if(z?.type==='zone')z.walls.forEach(w=>ids.add(w));}

function onMove(e){

  if(!d){if(E.chain){const l=E.chain.pts[E.chain.pts.length-1];E.chainCur=snapP(p,e,l);}else if(isWallTool(E.tool))snapP(p,e);renderOverlay();return;}
  const k=E.view.k;
  switch(d.kind){
    case 'pan':E.view.x=d.vx+e.clientX-d.sx;E.view.y=d.vy+e.clientY-d.sy;applyView();break;
    case 'move':{let dx=p.x-d.start.x,dy=p.y-d.start.y;if(!d.pushed){if(Math.hypot(dx,dy)*k<3)return;pushHist();d.pushed=true;}
      const onlyFree=[...d.orig.values()].every(o=>o.type==='station'||o.type==='text'||o.type==='door'||o.type==='obj');
      if(M.settings.snap&&!e.altKey&&!onlyFree){const g=M.settings.grid;dx=Math.round(dx/g)*g;dy=Math.round(dy/g)*g;}
      const bb=d.bb;if(bb){if(bb.w<=M.width)dx=clamp(dx,-bb.x,M.width-(bb.x+bb.w));if(bb.h<=M.height)dy=clamp(dy,-bb.y,M.height-(bb.y+bb.h));}

        Object.assign(el,clone(o));moveEl(el,dx,dy);}

    case 'handle':{const el=getEl(d.id);if(!d.pushed){pushHist();d.pushed=true;}const o=d.orig;
      if(d.h==='p1'||d.h==='p2'){const anchor=d.h==='p1'?{x:o.x2,y:o.y2}:{x:o.x1,y:o.y1};const q=snapP(p,e,anchor,d.skip);el['x'+d.h[1]]=q.x;el['y'+d.h[1]]=q.y;

    case 'furn':{if(!d.pushed){pushHist();d.pushed=true;}const F=M.furn[d.part],m=26*(F.s||1);F.x=Math.round(clamp(d.ox+p.x-d.start.x,m,M.width-m));F.y=Math.round(clamp(d.oy+p.y-d.start.y,m,M.height-m));render();break;}

  }

function onUp(){

const typing=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
document.addEventListener('keydown',e=>{
  if(route!=='map'||$('.modal-wrap'))return;
  if(typing(e.target)){if(e.key==='Escape')e.target.blur();return;}
  const mod=e.ctrlKey||e.metaKey,key=e.key.toLowerCase();
  if(mod&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&key==='y'){e.preventDefault();redo();return;}
  if(mod&&key==='d'){e.preventDefault();duplicateSel();return;}

  if(mod&&key==='s'){e.preventDefault();saveNow();toast('Saved');return;}
  if(mod||e.altKey)return;
  switch(e.key){
    case 'Delete':case 'Backspace':e.preventDefault();deleteSel();return;
    case 'Escape':if(E.chain)finishChain(false);else if(E.tool!=='select')setTool('select');else{E.sel.clear();renderAll();}return;
    case 'Enter':if(E.chain)finishChain(false);return;
    case ' ':e.preventDefault();E.space=true;$('#stage').classList.add('space');return;
    case '+':case '=':zoomBy(1.25);return;case '-':case '_':zoomBy(.8);return;case '0':fitView();return;
    case 'ArrowLeft':case 'ArrowRight':case 'ArrowUp':case 'ArrowDown':{if(!E.sel.size)return;e.preventDefault();softPush();const s=e.shiftKey?10:1;const dx=e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,dy=e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0;
      const nb=groupBox([...E.sel].map(getEl).filter(Boolean));let ndx=dx,ndy=dy;if(nb){ndx=clamp(dx,-nb.x,M.width-(nb.x+nb.w));ndy=clamp(dy,-nb.y,M.height-(nb.y+nb.h));}

  }
  if(/^[1-9]$/.test(e.key)){const c=CATS[+e.key-1];if(c){setTool('station',c.code);showTab('stations');}return;}
  const map={v:'select',h:'pan',w:'wall',f:'fence',r:'room',o:'objects',d:'objects',b:'rect',e:'ellipse',p:'polygon',l:'line',a:'arrow',t:'text'};
  if((key==='['||key===']')&&E.sel.size){softPush();for(const id of E.sel){const el=getEl(id);if(el?.type==='obj')el.rot=((el.rot||0)+(key===']'?15:-15)+540)%360-180;}changed();return;}
  if(map[key])setTool(map[key]);
});

function textFields(sc,o){return `${F.num(sc,'size','Size',o.size,1,4)}${F.color(sc,'color','Colour',o.color)}${F.sel(sc,'font','Font',o.font,Object.keys(FONTS).map(f=>[f,f]))}${F.sel(sc,'align','Align',o.align||'start',[['start','Left'],['middle','Centre'],['end','Right']])}

  ${(()=>{const hw=o.haloW??(o.halo===false?0:.2);return `<div class="f"><span>White outline</span><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-halo="-1" data-s="${sc}" aria-label="Thinner outline">−</button><input type="range" data-s="${sc}" data-k="haloW" min="0" max="0.6" step="0.02" value="${hw}" aria-label="Outline thickness" style="flex:1;min-width:0"><button class="btn sm" data-halo="1" data-s="${sc}" aria-label="Thicker outline">+</button><button class="btn sm ghost" data-halo="0" data-s="${sc}">None</button></div></div>`;})()}`;}
function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1;}return Math.abs(a/2)/(M.scale*M.scale);}

function onPanelInput(e){
  const t=e.target;if(t.id==='objQ'){E.objQ=t.value;const pos=t.selectionStart;renderPanel();const n=$('#objQ');n.focus();n.setSelectionRange(pos,pos);return;}
  if(t.id==='nextFrom'){const v=parseInt(t.value,10);if(v>=1&&E.cat){M.nextFrom=M.nextFrom||{};M.nextFrom[E.cat]=v;renderOverlay();const c=$(`.cat[data-cat="${E.cat}"] .cat-code`);if(c)c.textContent=E.cat+pad(nextNum(E.cat));$('#hint').innerHTML=`Click the plan to place <b>${esc(E.cat)}${pad(nextNum(E.cat))}</b>. <kbd>Esc</kbd> to stop.`;scheduleSave();}return;}
  if(t.id==='regQ'){E.regQ=t.value;const pos=t.selectionStart;renderPanel();const n=$('#regQ');n.focus();n.setSelectionRange(pos,pos);return;}
  const sc=t.dataset.s,k=t.dataset.k;if(!sc||!k)return;
  let v=t.type==='checkbox'?t.checked:(t.type==='number'||t.type==='range')?parseFloat(t.value):t.value;
  if(typeof v==='number'&&isNaN(v))return;
  setVal(sc,k,v);
}
function onPanelChange(e){const t=e.target;if(t.id==='regF'){E.regFilter=t.value;renderPanel();return;}
  if(t.type==='checkbox'||t.tagName==='SELECT')renderPanel();
  else if(t.dataset.k==='stype')renderPanel();}
function setVal(sc,k,v){
  if(sc==='arm'){const c=E.cat;E.catType[c]=E.catType[c]||{};E.catType[c][k]=v;if(k==='type'){const kt=knownTox(v);if(kt!==null)E.catType[c].toxic=kt;}renderOverlay();return;}
  if(sc==='style'){E.style[k]=v;return;}
  if(sc==='text'){E.textStyle[k]=v;return;}
  if(sc==='wall'){E.wallStyle[k]=v;return;}
  if(sc==='fence'){E.fenceStyle[k]=v;return;}
  if(sc==='brand'){BRAND[k]=k==='logoRight'?-v:v;saveBrand();render();return;}
  softPush();
  if(sc==='map'){if(k==='name'){M.name=v;crumbs([['Sites','#/'],[site?.name||'Site','#/site/'+M.siteId],[v,'#/map/'+M.id]]);}else if(v>=50)M[k]=Math.round(v);changed();return;}
  if(sc==='set'){if(k==='revision')E.manualRev=true;M.settings[k]=v;changed();return;}
  if(sc==='furn'){const[p,kk]=k.split('.');M.furn[p][kk]=v;changed();return;}
  if(sc==='set'&&k==='showFrame'){M.settings[k]=v;changed();fitView();return;}
  for(const id of E.sel){const el=getEl(id);if(!el)continue;
    switch(k){
      case 'len':{const L=Math.hypot(el.x2-el.x1,el.y2-el.y1)||1,n=fromU(v);if(n<=0)break;el.x2=el.x1+(el.x2-el.x1)/L*n;el.y2=el.y1+(el.y2-el.y1)/L*n;break;}
      case 'wU':el.w=Math.max(1,fromU(v));break;case 'hU':el.h=Math.max(1,fromU(v));break;
      case 'width':if(el.type==='door'){el.width=Math.max(2,fromU(v));const w=getEl(el.wall);if(w)el.t=clampT(el.t,w,el.width);}else if(el.type==='image'){const ar=el.w/el.h;el.w=Math.max(4,v);el.h=el.w/ar;}break;
      case 'w':if(el.type==='image'){const ar=el.w/el.h;el.w=Math.max(4,v);el.h=el.w/ar;}else el.w=v;break;
      case 'stype':el.stype=v;{const kt=knownTox(v);if(kt!==null)el.toxic=kt;}break;
      case 'num':el.num=Math.max(1,Math.round(v));break;
      case 'zdash':for(const w of zoneWalls(el))w.dash=v;break;
      case 'code':el.code=v;el.num=nextNum(v);{const c=catOf(v);if(c.mode!=='tox'&&!el.stype)el.stype=c.type;}break;
      default:el[k]=v;
    }}
  render();scheduleSave();
}
async function onPanelClick(e){
  const sw=e.target.closest('[data-sw]');if(sw){const inp=sw.closest('.f').querySelector('input[type=color]');inp.value=sw.dataset.sw;setVal(sw.dataset.s,sw.dataset.k,sw.dataset.sw);return;}
  const cat=e.target.closest('[data-cat]');if(cat){const c=cat.dataset.cat;if(E.tool==='station'&&E.cat===c)setTool('select');else{E.sel.clear();setTool('station',c);}renderPanel();return;}
  const ob=e.target.closest('[data-obj]');if(ob){E.objKind=ob.dataset.obj;if(E.tool!=='objects')setTool('objects');renderPanel();renderOverlay();$('#panel').classList.remove('open');return;}
  const hb=e.target.closest('[data-halo]');if(hb){const sc=hb.dataset.s,d=+hb.dataset.halo,cur=o=>o.haloW??(o.halo===false?0:.2),nv=o=>d===0?0:clamp(r2(cur(o)+d*.05),0,.6);
    if(sc==='text'){E.textStyle.haloW=nv(E.textStyle);}else{pushHist();for(const id of E.sel){const el=getEl(id);if(el?.type==='text')el.haloW=nv(el);}changed();}renderPanel();return;}
  const zf=e.target.closest('[data-zfill]');if(zf){pushHist();for(const id of E.sel){const el=getEl(id);if(el?.type==='zone')el.fill=zf.dataset.zfill;}changed();return;}
  const de=e.target.closest('[data-door-el]');if(de){pushHist();for(const id of E.sel){const el=getEl(id);if(el?.type==='door'){el.kind=de.dataset.doorEl;el.width=defaultDoorWidth(el.kind);const w=getEl(el.wall);if(w){el.width=Math.min(el.width,wallLen(w)*.95);el.t=clampT(el.t,w,el.width);}}}changed();return;}
  const loc=e.target.closest('[data-loc]');if(loc){const el=getEl(loc.dataset.loc);E.sel=new Set([el.id]);if(E.view.k<.6)E.view.k=1;centerOn(el.x,el.y);renderPanel();return;}
  const il=e.target.closest('[data-img-lock]');if(il){pushHist();const el=getEl(il.dataset.imgLock);el.locked=!el.locked;changed();return;}
  const id2=e.target.closest('[data-img-del]');if(id2){pushHist();M.elements=M.elements.filter(x=>x.id!==id2.dataset.imgDel);changed();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  switch(b.dataset.act){
    case 'stop':setTool('select');break;
    case 'zonefill':pushHist();M.elements=M.elements.filter(x=>!(E.sel.has(x.id)&&x.type==='zone'));E.sel.clear();changed();break;

    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;return{src:c.toDataURL('image/png'),w:c.width,h:c.height,pages:doc.numPages};

    before:async(v,d,w)=>{const btn=$('footer .primary',w);btn.disabled=true;btn.textContent='Exporting…';
      try{await doExport(d);}catch(e){console.error(e);toast('Export failed: '+e.message,'warn');btn.disabled=false;btn.textContent='Export';return false;}}});
}
async function doExport(d){
  const name=safeName(d.fname||'plan'),bg=true,res=3;await saveNow();
  if(d.fmt==='svg'){download(new Blob([buildSVG({bg})],{type:'image/svg+xml'}),name+'.svg');return;}
  const c=await rasterize(res,bg);
  if(d.fmt==='png'||d.fmt==='jpg'){const blob=await new Promise(r=>c.toBlob(r,d.fmt==='png'?'image/png':'image/jpeg',.92));if(!blob)throw new Error('the browser could not create the image');download(blob,name+'.'+d.fmt);return;}
  const jpg=new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',.92))).arrayBuffer());
  /* page is the sheet itself, edge to edge: exactly A4 for A4 plans, otherwise the plan's own shape at A4 width */
  const g=sheet(),SW=g.W,SH=g.H,land=SW>=SH,A4L=841.89,A4S=595.28,paper=paperOf();let pw,ph;
  if(paper==='a4l'){pw=A4L;ph=A4S;}else if(paper==='a4p'){pw=A4S;ph=A4L;}else if(land){pw=A4L;ph=A4L*SH/SW;}else{ph=A4L;pw=A4L*SW/SH;}
  const iw=pw,ih=ph,ix=0,iy=0;
  download(makePdf(jpg,c.width,c.height,pw,ph,ix,iy,iw,ih,`${site?.name||''} - ${M.name}`),name+'.pdf');
}
/* Minimal single-page PDF writer: one JPEG drawn at (x,y,w,h) in points. */
function makePdf(jpg,pxW,pxH,pw,ph,x,y,w,h,title){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(n,body,stream)=>{offs[n]=len;push(`${n} 0 obj\n${body}\n`);if(stream){push('stream\n');push(stream);push('\nendstream\n');}push('endobj\n');};
  const f=v=>(Math.round(v*100)/100).toString();
  const pdfStr=t=>'('+String(t).replace(/[^\x20-\x7e]/g,'-').replace(/([\\()])/g,'\\$1')+')';
  const content=enc.encode(`q ${f(w)} 0 0 ${f(h)} ${f(x)} ${f(ph-y-h)} cm /Im0 Do Q`);
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw)} ${f(ph)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4,`<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`,jpg);
  obj(5,`<< /Length ${content.length} >>`,content);
  obj(6,`<< /Title ${pdfStr(title)} /Creator (Station Planner) >>`);
  const xref=len;let x2=`xref\n0 7\n0000000000 65535 f \n`;for(let i=1;i<=6;i++)x2+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x2+`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
function exportCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const rows=[['Station ID','Category','Type','Toxic','Notes',M.scale?'X (m)':'X (px)',M.scale?'Y (m)':'Y (px)'].map(q).join(',')];
  M.elements.filter(e=>e.type==='station').sort((a,b)=>a.code.localeCompare(b.code)||a.num-b.num).forEach(e=>{const c=catOf(e.code);rows.push([stId(e),c.name,e.stype,c.mode==='tox'?(e.toxic?'Yes':'No'):'',e.notes,M.scale?(e.x/M.scale).toFixed(2):Math.round(e.x),M.scale?(e.y/M.scale).toFixed(2):Math.round(e.y)].map(q).join(','));});
  download(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'}),safeName(`${site?.name||'Site'} - ${M.name} - station register`)+'.csv');
}

  const els=m.elements,W=(x1,y1,x2,y2)=>{const w={id:uid(),type:'wall',x1,y1,x2,y2,w:6,color:'#2a2f36'};els.push(w);return w;};
  const top=W(260,240,1040,240),right=W(1040,240,1040,800),bot=W(1040,800,260,800),left=W(260,800,260,240),mid=W(780,240,780,800),od=W(780,520,1040,520);
  const D=(wall,kind,t,m2)=>els.push({id:uid(),type:'door',kind,wall:wall.id,t,width:m2*25,flip:0,hinge:0});
  D(bot,'roller',.167,4);D(mid,'single',.3,.9);D(od,'single',.5,.9);D(left,'double',.5,1.8);D(top,'exit',.2,.9);D(top,'window',.85,1.4);D(right,'window',.25,1.4);
  els.push({id:uid(),type:'polygon',pts:[[80,80],[1200,80],[1200,1020],[80,1020]],stroke:'#495057',fill:'#2b9348',noFill:true,fillOp:.1,sw:2,dash:true});
  els.push({id:uid(),type:'rect',x:300,y:600,w:260,h:160,stroke:'#1971c2',fill:'#1971c2',noFill:false,fillOp:.1,sw:1.5,dash:true,rx:4});
  const T=(x,y,text,size=24,bold=true,color='#495057')=>els.push({id:uid(),type:'text',x,y,text,size,color,font:'Arial',bold,italic:false,halo:true,align:'middle'});
  T(520,480,'Production');T(910,370,'Office');T(910,650,'Dispatch');T(430,670,'Raw materials',14,false,'#1971c2');T(640,1032,'Fence line',13,false);T(1120,915,'Loading bay',14,false);
  els.push({id:uid(),type:'dim',x1:260,y1:905,x2:1040,y2:905,color:'#495057',size:13});
  const st=(code,list,stype,toxic)=>list.forEach((p,i)=>els.push({id:uid(),type:'station',code,num:i+1,x:p[0],y:p[1],stype,toxic,notes:'',size:1}));
  st('T',[[290,270],[520,270],[750,270],[290,770],[640,770],[750,770]],'Multi-catch trap',false);
  st('S',[[220,200],[650,200],[1080,200],[1080,840],[650,840],[220,840]],'Toxic bait station',true);
  st('F',[[80,300],[80,760],[640,80],[1200,550],[400,1020]],'Toxic bait station',true);
  st('V',[[420,420],[620,640],[900,420]],'Insect monitor (glue board)',false);
  st('U',[[290,520],[1010,690]],'Insect light trap (ILT)',false);
  st('X',[[1000,280]],'Inspection point',false);st('W',[[1010,770]],'Vertebrate monitor',false);st('CP',[[1120,700]],'Control panel',false);
  els.find(e=>e.type==='station'&&e.code==='X').notes='Floor drain, check monthly';
  return m;
}
function showConnect(msg){
  route='connect';M=null;site=null;crumbs([['Connect to server','#/']]);$('#topActions').innerHTML=themeBtn();
  const mixed=location.protocol==='https:'&&/^http:/i.test(Store.base);
  $('#view').innerHTML=`<div class="page"><div class="page-in" style="max-width:640px"><div class="page-head"><div><h1>Connect to your server</h1>
    <p>Plans are saved on your Station Planner server, so they're the same on every device. Enter the server address the setup script printed, for example <b>https://140-238-1-2.sslip.io</b>.</p></div></div>
    <form id="cxForm" class="sec" style="gap:12px"><label class="f" style="grid-template-columns:120px minmax(0,1fr)"><span>Server address</span><input id="cxUrl" type="url" required placeholder="https://…" value="${esc(Store.base)}" style="height:36px"></label>
    ${Store.base?`<p class="warn">${esc(msg||(mixed?'This page is https, so it can only use an https server address.':`Can't reach ${Store.base}. Check the address and that the server is running.`))}</p>`:''}
    <div class="row"><button class="btn primary" type="submit">Connect</button></div></form></div></div>`;
  $('#cxForm').onsubmit=async e=>{e.preventDefault();const v=$('#cxUrl').value.trim().replace(/\/+$/,'');if(!v)return;const b=$('#cxForm .primary');b.disabled=true;b.textContent='Connecting…';
    try{await Store.health(v);Store.setBase(v);toast('Connected');boot();}catch(err){b.disabled=false;b.textContent='Connect';showConnect(err.message==='Failed to fetch'?`Can't reach ${v}. Check the address, that the server is running, and that ports 80 and 443 are open.`:err.message);}};
}
async function openServerDialog(){
  let info='';try{const h=await Store.health();info=`Connected. The server holds ${h.counts.sites||0} site${h.counts.sites===1?'':'s'} and ${h.counts.maps||0} plan${h.counts.maps===1?'':'s'}.`;}catch(e){info=`Not connected: ${e.message}.`;}
  let local=null;if(await LocalStore.open()){try{const ls=await LocalStore.all('sites'),lm=await LocalStore.all('maps');local={sites:ls.length,maps:lm.length};}catch(e){}}
  const r=await modal({title:'Server',body:`<label class="f"><span>Server address</span><input name="url" type="url" value="${esc(Store.base)}"></label><p>${esc(info)}</p>
    ${local&&local.maps?`<div class="divider"></div><p>This browser also has <b>${local.sites} site${local.sites===1?'':'s'}</b> and <b>${local.maps} plan${local.maps===1?'':'s'}</b> saved from before the server was set up.</p><div class="row"><button type="button" class="btn" id="svUp">${ICON.upload}Copy them to the server</button></div><p class="hint" id="svUpMsg">Anything already on the server is left as it is.</p>`:''}`,
    buttons:[{label:'Close',value:null},{label:'Save address',value:'ok',primary:true}],
    onOpen:w=>{const up=$('#svUp',w);if(up)up.onclick=async()=>{up.disabled=true;const m=$('#svUpMsg',w);try{const n=await uploadLocal(t=>m.textContent=t);m.textContent=`Done: copied ${n.sites} site${n.sites===1?'':'s'} and ${n.maps} plan${n.maps===1?'':'s'}.`;if(route==='sites')showSites();}catch(e){m.textContent='Copy stopped: '+e.message;up.disabled=false;}};},
    before:async(v,d)=>{const u=d.url.trim().replace(/\/+$/,'');if(u===Store.base)return;try{await Store.health(u);}catch(e){toast(`Can't connect to ${u}: ${e.message}`,'warn');return false;}}});
  if(r.value==='ok'){const u=r.data.url.trim().replace(/\/+$/,'');if(u!==Store.base){Store.setBase(u);toast('Server changed');boot();}}
}
/* Copy sites, plans, images and settings saved in this browser up to the server. Existing server records are kept. */
async function uploadLocal(progress){
  if(!(await LocalStore.open()))throw new Error('this browser has no saved data');
  const sites=await LocalStore.all('sites'),maps=await LocalStore.all('maps');const n={sites:0,maps:0};
  for(const s of sites){if(!(await Store.get('sites',s.id))){await Store.put('sites',s);n.sites++;}}
  let i=0;for(const m of maps){i++;progress&&progress(`Copying plan ${i} of ${maps.length}…`);
    if(await Store.get('maps',m.id))continue;const a=await LocalStore.get('assets',m.id);await Store.put('assets',{id:m.id,data:a?.data||{}});
    const h=await LocalStore.get('meta','hist:'+m.id);if(h)await Store.put('meta',h);await Store.put('maps',m);n.maps++;}
  for(const k of ['cats','brand']){const v=await LocalStore.get('meta',k);if(v&&!(await Store.get('meta',k)))await Store.put('meta',v);}
  return n;
}
async function boot(){
  if(!(await Store.open())){showConnect();return;}
  if(route==='connect')route='';
  try{const c=await Store.get('meta','cats');if(c?.value?.length)CATS=c.value;}catch(e){}
  /* one-off: flying insect prefix FI -> U, in the station types and in every saved plan */
  try{if(!(await Store.get('meta','mig-fi-u'))){const fi=CATS.find(c=>c.code==='FI');if(fi&&!CATS.find(c=>c.code==='U')){fi.code='U';await Store.put('meta',{id:'cats',value:CATS});}
    if(CATS.find(c=>c.code==='U'))for(const m of await Store.all('maps')){let ch=false;for(const e of m.elements)if(e.type==='station'&&e.code==='FI'){e.code='U';ch=true;}if(ch)await Store.put('maps',m);}
    await Store.put('meta',{id:'mig-fi-u',value:true});}}catch(e){console.error(e);}
  /* one-off: the default types become circles, and third line defaults to non-toxic */
  try{if(!(await Store.get('meta','mig-v5'))){const codes=new Set(DEFAULT_CATS.map(c=>c.code));for(const c of CATS){if(codes.has(c.code))c.shape='circle';if(c.code==='T'&&/toxic bait/i.test(c.type)&&!/non/i.test(c.type))c.type='Non-toxic bait station';}
    await Store.put('meta',{id:'cats',value:CATS});await Store.put('meta',{id:'mig-v5',value:true});}}catch(e){console.error(e);}
  try{const b=await Store.get('meta','brand');if(b?.value)BRAND={...BRAND,...b.value};if(BRAND.logo&&!BRAND.logoAR){const i=await loadImg(BRAND.logo);BRAND.logoAR=(i.naturalWidth/i.naturalHeight)||3;}}catch(e){}
  try{const seeded=await Store.get('meta','seeded');if(!seeded&&!(await Store.all('sites')).length){
    const s={id:uid(),name:'Teagle Foods',address:'12 Example Road, East Tāmaki, Auckland',client:'Example contact',siteRef:'NZ0000000000001',contractNo:'00000000/00001',notes:'Example site showing how a plan is laid out. Edit or delete it any time.',created:Date.now(),updated:Date.now(),sample:true};
    await Store.put('sites',s);const m=sampleMap(s.id);await Store.put('maps',m);await Store.put('assets',{id:m.id,data:{}});}
    await Store.put('meta',{id:'seeded',value:true});}catch(e){console.error(e);}
  go();
}
boot();
